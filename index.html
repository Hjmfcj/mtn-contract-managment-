<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTN — Contract Management</title>
<style>
  :root{
    --navy:#1a1a1a; --navy2:#2b2b2b; --teal:#7a5b00; --teal2:#ffcb00; --yellow:#ffcb00; --black:#0f0f0f;
    --amber:#c77a1c; --amber-bg:#fdf1e0; --red:#b3261e; --red-bg:#fbe9e7;
    --green:#1e7d4c; --green-bg:#e7f6ee; --grey:#5b6b7a; --grey-bg:#eef1f4;
    --bg:#f2f4f7; --card:#ffffff; --border:#e5e7eb; --text:#2b2b2b; --muted:#5b6b7a;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  header.topbar{background:var(--black);border-bottom:3px solid var(--yellow);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.15);}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;}
  .brand .mark{width:34px;height:34px;border-radius:8px;background:var(--yellow);display:flex;align-items:center;justify-content:center;overflow:hidden;}.brand .mark img{width:34px;height:34px;display:block;}
  .brand small{display:block;font-weight:400;opacity:.75;font-size:11px;}
  .topbar-right{display:flex;align-items:center;gap:14px;}
  select.roleSelect{background:#ffffff22;color:#fff;border:1px solid #ffffff55;border-radius:8px;padding:7px 10px;font-size:13px;}
  select.roleSelect option{color:#111;}
  .bell{position:relative;cursor:pointer;font-size:18px;padding:6px 8px;border-radius:8px;}
  .bell:hover{background:#ffffff1a;}
  .bell .badge{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;font-size:10px;border-radius:10px;padding:1px 5px;font-weight:700;}
  .shell{display:flex;min-height:calc(100vh - 52px);}
  nav.side{width:230px;background:var(--black);border-right:1px solid #000;padding:14px 10px;flex-shrink:0;}
  nav.side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#8a8a8a;margin:14px 8px 6px;font-weight:700;}
  nav.side a{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;color:#e6e6e6;text-decoration:none;font-size:13.5px;margin-bottom:2px;cursor:pointer;}
  nav.side a:hover{background:#262626;}
  nav.side a.active{background:var(--yellow);color:#1a1a1a;font-weight:600;}
  main{flex:1;padding:22px 26px;max-width:1180px;}
  h1.pageTitle{font-size:20px;margin:0 0 3px;}
  p.pageSub{color:var(--muted);font-size:13px;margin:0 0 18px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;}
  .card h3{margin:0 0 10px;font-size:14.5px;}
  .grid{display:grid;gap:14px;}
  .grid.cols4{grid-template-columns:repeat(4,1fr);}
  .grid.cols3{grid-template-columns:repeat(3,1fr);}
  .grid.cols2{grid-template-columns:repeat(2,1fr);}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
  .stat .num{font-size:24px;font-weight:800;color:var(--navy);}
  .stat .lbl{font-size:12px;color:var(--muted);margin-top:2px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--border);padding:8px 8px;}
  td{padding:9px 8px;border-bottom:1px solid #eef1f4;}
  tr.rowlink{cursor:pointer;}
  tr.rowlink:hover{background:var(--grey-bg);}
  .pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
  .pill.grey{background:var(--grey-bg);color:var(--grey);}
  .pill.amber{background:var(--amber-bg);color:var(--amber);}
  .pill.green{background:var(--green-bg);color:var(--green);}
  .pill.red{background:var(--red-bg);color:var(--red);}
  .pill.teal{background:#fff6cc;color:var(--teal);}
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--yellow);background:var(--yellow);color:#1a1a1a;padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600;}
  .btn:hover{background:#e6b700;border-color:#e6b700;}
  .btn.secondary{background:#fff;color:#1a1a1a;border-color:#d4d4d4;}
  .btn.secondary:hover{background:var(--grey-bg);}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn.danger{background:var(--red);border-color:var(--red);color:#fff;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .toolbar select,.toolbar input{padding:7px 9px;border:1px solid var(--border);border-radius:7px;font-size:12.5px;background:#fff;}
  label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600;}
  input[type=text],input[type=number],input[type=date],textarea,select.fld{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:inherit;}
  textarea{resize:vertical;min-height:60px;}
  .back{color:var(--teal);cursor:pointer;font-size:13px;font-weight:600;display:inline-block;margin-bottom:10px;}
  .stepper{display:flex;flex-wrap:wrap;gap:0;margin:8px 0 18px;}
  .step{flex:1;min-width:110px;text-align:center;padding:8px 4px;border-bottom:4px solid var(--border);font-size:10.5px;color:var(--muted);position:relative;}
  .step.done{border-color:var(--green);color:var(--green);font-weight:700;}
  .step.current{border-color:var(--teal2);color:var(--teal);font-weight:800;}
  .step .n{display:block;font-size:13px;}
  .owner-tag{font-size:11px;color:var(--muted);background:var(--grey-bg);padding:2px 8px;border-radius:6px;display:inline-block;margin-top:4px;}
  .banner{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
  .banner.green{background:var(--green-bg);color:var(--green);}
  .banner.amber{background:var(--amber-bg);color:var(--amber);}
  .banner.red{background:var(--red-bg);color:var(--red);}
  .note{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .flex-between{display:flex;justify-content:space-between;align-items:center;}
  .modal-bg{position:fixed;inset:0;background:#0b254088;display:flex;align-items:center;justify-content:center;z-index:100;}
  .modal{background:#fff;border-radius:12px;padding:22px;width:480px;max-width:92vw;max-height:86vh;overflow:auto;}
  .modal h3{margin-top:0;}
  .modal .close{float:right;cursor:pointer;color:var(--muted);font-size:14px;}
  .bar{height:8px;background:var(--grey-bg);border-radius:6px;overflow:hidden;}
  .bar > div{height:100%;background:var(--teal2);}
  .bar.over > div{background:var(--red);}
  .chartrow{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:10px;}
  .chartrow .c{flex:1;background:var(--teal2);border-radius:4px 4px 0 0;position:relative;}
  .chartrow .c span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted);}
  .chartrow .lbl{flex:1;text-align:center;font-size:10px;color:var(--muted);margin-top:4px;}
  .disclaimer{font-size:11px;color:var(--muted);text-align:center;padding:14px 0 26px;}
  .empty{padding:26px;text-align:center;color:var(--muted);font-size:13px;}
  .sig-line{border:1px dashed var(--border);border-radius:8px;padding:10px;margin-top:8px;font-size:12.5px;}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13px;}
  .kv b{color:var(--muted);font-weight:600;}
  .taglist span{display:inline-block;background:var(--grey-bg);padding:2px 8px;border-radius:6px;font-size:11px;margin:2px 4px 2px 0;}
  /* ---- Contract expiry & notifications ---- */
  .pill.solid{background:var(--red);color:#fff;}
  .topbar-right{position:relative;}
  .todayChip{font-size:12px;color:#e6e6e6;border:1px solid #ffffff33;border-radius:8px;padding:6px 10px;white-space:nowrap;}
  .bell.alert .badge{animation:pulse 1.8s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(179,38,30,.65);}70%{box-shadow:0 0 0 8px rgba(179,38,30,0);}100%{box-shadow:0 0 0 0 rgba(179,38,30,0);}}
  .bellpanel{display:none;position:absolute;right:0;top:46px;width:400px;max-width:92vw;background:#fff;color:var(--text);border-radius:12px;box-shadow:0 12px 36px rgba(0,0,0,.28);z-index:90;overflow:hidden;max-height:76vh;overflow-y:auto;border:1px solid var(--border);}
  .bp-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;}
  .bp-item{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid #eef1f4;cursor:pointer;}
  .bp-item:hover{background:var(--grey-bg);}
  .bp-item.unread{background:#fffbea;}
  .bp-title{font-weight:700;font-size:12.5px;margin-bottom:2px;}
  .bp-msg{font-size:12.5px;color:#3b3b3b;line-height:1.35;}
  .bp-foot{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;background:#fafafa;}
  .bp-link{color:var(--teal);font-size:12.5px;font-weight:700;cursor:pointer;text-decoration:none;}
  .bp-link:hover{text-decoration:underline;}
  .sevdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-top:4px;flex-shrink:0;background:#c9ced4;}
  .sevdot.sev-expired{background:var(--red);} .sevdot.sev-critical{background:#e0554b;} .sevdot.sev-warning{background:var(--amber);}
  .sevdot.sev-notice{background:#e6b700;} .sevdot.sev-watch{background:#8a9aaa;} .sevdot.sev-ok{background:var(--green);}
  .expstrip{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;background:var(--amber-bg);color:#7a4a0c;font-size:13px;margin-bottom:16px;cursor:pointer;border:1px solid #f1d6ab;}
  .expstrip.hot{background:var(--red-bg);color:var(--red);border-color:#f2c4bf;}
  .expstrip .sevdot{margin-top:0;}
  .expstrip .lnk{margin-left:auto;font-weight:700;white-space:nowrap;}
  .chip{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:12px;margin:0 3px 3px 0;}
  .chip.sent{background:var(--green-bg);color:var(--green);} .chip.pending{background:var(--grey-bg);color:var(--grey);} .chip.skip{background:#f4f4f4;color:#a0a0a0;}
  .tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px;}
  .card .tiles{margin-bottom:6px;}
  .tile{background:#fff;border:1px solid var(--border);border-top:4px solid var(--grey);border-radius:10px;padding:11px 14px;cursor:pointer;}
  .tile:hover{background:var(--grey-bg);}
  .tile.active{box-shadow:0 0 0 2px var(--yellow);}
  .tile .n{font-size:26px;font-weight:800;line-height:1.1;} .tile .l{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .tile.expired{border-top-color:var(--red);} .tile.critical{border-top-color:#e0554b;} .tile.warning{border-top-color:var(--amber);}
  .tile.notice{border-top-color:#e6b700;} .tile.watch{border-top-color:#8a9aaa;} .tile.ok{border-top-color:var(--green);}
  .watchrow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid #eef1f4;cursor:pointer;}
  .watchrow:hover{background:var(--grey-bg);}
  .watchrow .sevdot{margin-top:0;}
  tr.grouphead td{background:#f7f8fa;font-weight:700;font-size:12px;padding:8px 8px;border-bottom:1px solid var(--border);}
  tr.grouphead .sevdot{margin:0 6px 0 0;vertical-align:middle;}
  .actcol{display:flex;flex-wrap:wrap;gap:5px;max-width:190px;}
  label.chk{display:inline-block;margin:2px 14px 2px 0;font-size:12.5px;}
  label.chk input{margin-right:4px;vertical-align:middle;}
  /* timeline */
  .tl{margin-top:8px;overflow-x:auto;}
  .tl-track{position:relative;margin-left:220px;min-width:480px;}
  .tl-axis{position:relative;height:26px;font-size:10.5px;color:var(--muted);font-weight:600;}
  .tl-axis span{position:absolute;top:7px;transform:translateX(-50%);white-space:nowrap;}
  .tl-bands{position:absolute;left:0;right:0;top:26px;bottom:0;display:flex;border-radius:6px;overflow:hidden;}
  .tl-bands div{height:100%;}
  .b-exp{background:repeating-linear-gradient(135deg,#fbe9e7,#fbe9e7 6px,#f6d9d5 6px,#f6d9d5 12px);}
  .b-crit{background:#fdeceb;} .b-warn{background:var(--amber-bg);} .b-note{background:#fff9dd;} .b-watch{background:#f1f3f5;} .b-ok{background:#f2faf5;}
  .tl-today{position:absolute;top:18px;bottom:0;width:2px;background:var(--black);z-index:3;}
  .tl-row{position:relative;height:38px;cursor:pointer;z-index:2;}
  .tl-row:hover{background:rgba(255,255,255,.55);}
  .tl-label{position:absolute;left:-220px;width:210px;top:4px;font-size:12px;line-height:1.25;}
  .tl-label b{display:block;} .tl-label span{display:block;color:var(--muted);font-size:11px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;}
  .tl-bar{position:absolute;top:14px;height:10px;border-radius:5px;opacity:.9;}
  .tl-bar.hatch{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.35),rgba(255,255,255,.35) 3px,transparent 3px,transparent 6px)!important;}
  .tl-end{position:absolute;top:11px;width:16px;height:16px;border-radius:50%;border:3px solid #fff;transform:translateX(-50%);box-shadow:0 0 0 1px rgba(0,0,0,.18);}
  .tl-txt{position:absolute;top:10px;background:rgba(255,255,255,.78);padding:0 4px;border-radius:4px;z-index:2;font-size:11px;color:#3b3b3b;white-space:nowrap;font-weight:600;}
  /* contract detail expiry panel */
  .expcard{border-left:5px solid var(--green);}
  .expcard.expired{border-left-color:var(--red);} .expcard.critical{border-left-color:#e0554b;} .expcard.warning{border-left-color:var(--amber);}
  .expcard.notice{border-left-color:#e6b700;} .expcard.watch{border-left-color:#8a9aaa;}
  .termbar{position:relative;height:10px;background:var(--grey-bg);border-radius:6px;margin:30px 0 8px;}
  .termbar .fill{height:100%;border-radius:6px;}
  .termbar .mk{position:absolute;top:-7px;width:2px;height:24px;background:var(--black);}
  .termbar .mk span{position:absolute;top:-17px;left:-16px;font-size:10.5px;font-weight:700;}
  .trail .trow{display:flex;gap:10px;padding:7px 0;font-size:13px;}
  .tdot{width:12px;height:12px;border-radius:50%;border:2px solid #b8c0c8;margin-top:3px;flex-shrink:0;background:#fff;}
  .tdot.done{background:var(--green);border-color:var(--green);}
  /* notification center */
  .chipbtn{display:inline-block;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:12.5px;font-weight:600;cursor:pointer;}
  .chipbtn.on{background:var(--yellow);border-color:var(--yellow);color:#1a1a1a;}
  .ncard{border:1px solid var(--border);border-left:5px solid #c9ced4;border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fff;font-size:13px;}
  .ncard.unread{background:#fffdf0;}
  .ncard.sev-expired{border-left-color:var(--red);} .ncard.sev-critical{border-left-color:#e0554b;} .ncard.sev-warning{border-left-color:var(--amber);}
  .ncard.sev-notice{border-left-color:#e6b700;} .ncard.sev-watch{border-left-color:#8a9aaa;} .ncard.sev-ok{border-left-color:var(--green);}
  .newdot{display:inline-block;background:var(--black);color:var(--yellow);font-size:10px;font-weight:800;padding:1px 7px;border-radius:10px;margin-left:4px;}
  .toast{display:none;position:fixed;right:22px;bottom:22px;background:#1a1a1a;color:#fff;border-left:4px solid var(--yellow);padding:12px 16px;border-radius:8px;z-index:300;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:380px;}
  .toast.err{border-left-color:#e0554b;}
  .pill.capex{background:#1a1a1a;color:#ffcb00;}
  .pill.opex{background:#fff6cc;color:#7a5b00;}
  .splitbar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:#eef1f4;}
  .splitbar .sc{background:#1a1a1a;} .splitbar .so{background:#ffcb00;}
  .splitrow{display:grid;grid-template-columns:190px 1fr 190px;gap:14px;align-items:center;margin:10px 0;font-size:13px;}
  .splitrow .lg{font-size:12.5px;color:var(--muted);text-align:right;}
  .lgdot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;}
  .pickrow{display:block;padding:9px 6px;border-bottom:1px solid #eef1f4;font-size:13px;cursor:pointer;}
  .pickrow:hover{background:var(--grey-bg);}
  .numcell{text-align:center;font-weight:700;}
  tr.totalrow td{border-top:2px solid var(--border);font-weight:700;background:#fafafa;}
  /* ---- v1.3 additions ---- */
  .pill.capex{background:#e3eefb;color:#1c5cab;}
  .pill.opex{background:#fdebe3;color:#a8441a;}
  .splitbar .sc{background:#2a78d6;} .splitbar .so{background:#eb6834;}
  .splitbar{gap:2px;}
  .modal.wide{width:880px;max-width:95vw;}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
  .lntable{width:100%;margin-top:2px;} .lntable td{padding:3px 4px;border-bottom:none;} .lntable th{padding:4px;}
  .lntable input{padding:6px 7px;font-size:12.5px;}
  .lntable .rm{cursor:pointer;color:var(--muted);padding:2px 6px;} .lntable .rm:hover{color:var(--red);}
  .totalsbox{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:13px;margin-top:8px;}
  .totalsbox div{display:flex;gap:18px;} .totalsbox span{color:var(--muted);} .totalsbox b{min-width:110px;text-align:right;}
  .totalsbox .tt{border-top:1px solid var(--border);padding-top:4px;font-size:14px;}
  .optbox{border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-top:14px;background:#fafafa;}
  .optbox .opt{display:block;padding:6px 0;font-size:13px;cursor:pointer;}
  .optbox .opt input[type=radio]{margin-right:6px;}
  .step.skip{border-color:#d7dbe0;border-bottom-style:dashed;color:#a3acb5;font-weight:400;}
  .step i{display:block;font-style:normal;font-size:9.5px;color:#9aa4ad;margin-top:2px;}
  .chipbtn.small{padding:3px 10px;font-size:11.5px;}
  /* purchase order document */
  .podoc{padding:26px 30px;font-size:13px;}
  .po-head{display:flex;justify-content:space-between;} .po-title{font-size:20px;font-weight:700;} .po-meta{color:#444;margin-top:4px;line-height:1.6;}
  .po-parties{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:22px 0 16px;line-height:1.55;} .po-parties > div:last-child{text-align:right;}
  .po-bar{background:#e8e8e8;padding:7px 10px;font-weight:700;margin-bottom:10px;}
  .po-terms{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:16px;line-height:1.7;}
  .po-items th{background:#f2f2f2;text-transform:none;font-size:12px;color:#333;} .po-items td{vertical-align:top;}
  .po-totals{display:flex;flex-direction:column;align-items:flex-end;margin:14px 0;gap:4px;} .po-totals div{display:flex;gap:30px;min-width:260px;justify-content:space-between;padding:3px 8px;}
  .po-totals .tt{background:#e8e8e8;font-size:14px;} .po-notes{font-size:12px;color:#333;padding-left:18px;margin-top:20px;}
  /* reports */
  .vsvg{width:100%;height:auto;display:block;} .vsvg text{font-family:inherit;}
  .vax{font-size:11px;fill:#5b6b7a;} .vax2{font-size:10px;fill:#8a96a3;} .vlab{font-size:12px;fill:#2b2b2b;} .vval{font-size:11.5px;fill:#2b2b2b;font-weight:700;} .vval2{font-size:11.5px;fill:#2b2b2b;font-weight:600;}
  .vhit:hover{fill:rgba(26,26,26,.05);} .vhit:focus{outline:none;fill:rgba(26,26,26,.07);}
  .vlegend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:#2b2b2b;} .vlegend .lgi i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;} .vlegend em{color:var(--muted);font-style:normal;}
  #vizTip{display:none;position:fixed;z-index:400;background:#fff;border:1px solid #d4d8de;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.16);padding:8px 11px;font-size:12px;pointer-events:none;min-width:130px;}

<script>
/* MTN — Contract Management (interactive prototype) */

const ROLES = [
  'Technology Department',
  'Procurement',
  'Vendor Management',
  'Finance / Budget Owner',
  'Strategy',
  'Legal',
  'Executive Management',
  'Vendor (External)'
];
// Confirmed by Shehab (31-Aug-2026): Procurement and Strategy are the two primary
// day-to-day stakeholders for this solution — both get a dedicated deep workspace
// below (Procurement Workspace / Strategic Portfolio View), not just a generic role.
// Document Management System — contracts/forms are archived there on execution.
const ARCHIVE_INTEGRATION = true;

const FULL = /[?&]full\b/.test(location.search);
const PHASE1 = !FULL && /[?&]phase1\b/.test(location.search);
// Phase 1 (default): two roles, Requester and Procurement. Opening the file with ?full at the end of its address shows every role and the 14-step process.
const LEAN = !FULL && !PHASE1;
const P1_HIDDEN_ROLES = ['Strategy'];
const P1_HIDDEN_NOTIF = ['Budget','Payment','Flag','Approval'];
const P1_HIDDEN_AUDIT = /(CRF|IAC|FAC|TPRA|payment forecast|Budget threshold|strategic|Flagged)/i;
function visibleRoles(){ return LEAN ? ['Technology Department','Procurement'] : (PHASE1 ? ROLES.filter(r=>!P1_HIDDEN_ROLES.includes(r)) : ROLES); }
function archiveRef(){ return 'DA-' + Math.floor(100000+Math.random()*899999); }

const STEPS = [
  {n:1, name:'Business Need Identification', owner:'Technology Department'},
  {n:2, name:'Budget Verification & Approval', owner:'Finance / Budget Owner'},
  {n:3, name:'Purchase Requisition (PR) Creation', owner:'Technology Department'},
  {n:4, name:'Procurement Strategy & Sourcing', owner:'Procurement'},
  {n:5, name:'Vendor Identification & Invitation', owner:'Procurement'},
  {n:6, name:'Vendor Proposal Submission', owner:'Vendor (External)'},
  {n:7, name:'Technical Evaluation', owner:'Technology Department'},
  {n:8, name:'Commercial Evaluation', owner:'Finance / Budget Owner'},
  {n:9, name:'Vendor Selection & Recommendation', owner:'Vendor Management'},
  {n:10, name:'Negotiation', owner:'Vendor Management'},
  {n:11, name:'Purchase Order (PO) Creation', owner:'Procurement'},
  {n:12, name:'Contract Drafting', owner:'Vendor Management'},
  {n:13, name:'Internal Contract Review & Approval', owner:'Legal'},
  {n:14, name:'Contract Signature & Execution', owner:'Executive Management'}
];
STEPS.forEach(st=>{ if(st.n>=12) st.optional = true; });
if(PHASE1){ STEPS[2].name = 'Purchase Requisition (PR) Reference'; STEPS[10].name = 'Purchase Order (PO) Reference'; }

const DEPARTMENTS = ['Technology','Network Operations','Marketing','Customer Experience','Finance'];
const PROJECT_TYPES = ['Network Infrastructure','IT Systems','Software License','Managed Services','Professional Services'];
const BUDGET_CATS = ['CAPEX','OPEX'];
const STATUSES = ['Draft','Under Review','Approved','Tendering','Contracting','Completed'];

const VENDORS = [
  {id:'V-01', name:'Khartoum Digital Systems', category:'IT Systems', contact:'sales@khartoumdigital.sd'},
  {id:'V-02', name:'Blue Nile Software House', category:'Software License', contact:'contracts@bluenilesoft.sd'},
  {id:'V-03', name:'Nile Valley Networks', category:'Network Infrastructure', contact:'procurement@nilevalleynet.sd'},
  {id:'V-04', name:'Sahara Telecom Supplies', category:'Managed Services', contact:'info@saharatelecom.sd'},
  {id:'V-05', name:'Atlas Fiber Solutions', category:'Network Infrastructure', contact:'bd@atlasfiber.sd'}
];

let uidSeq = 1000;
function uid(prefix){ uidSeq++; return prefix + '-' + uidSeq; }
function fmt$(n){ return '$' + Number(n).toLocaleString('en-US',{maximumFractionDigits:0}); }
function fmtDate(d){ if(!d) return '—'; const dt = (d instanceof Date)?d:new Date(d); return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function daysBetween(a,b){ return Math.round((new Date(b) - new Date(a))/86400000); }

let TODAY = new Date('2026-08-31');

/* ---------------- SEED DATA ---------------- */

let DATA = { requests:[], contracts:[], budgets:[], forms:[], forecasts:[], payments:[], notifications:[], audit:[], prpo:[] };

function addAudit(actor, action, entity, ts){
  DATA.audit.unshift({id:uid('AL'), ts:new Date(ts||TODAY), actor, action, entity});
}
function notify(forRole, type, message, extra){
  if(PHASE1 && P1_HIDDEN_NOTIF.includes(type)) return;
  DATA.notifications.unshift(Object.assign({id:uid('N'), forRole, type, message, ts:new Date(TODAY), read:false}, extra||{}));
}


function deductBudget(dept, category, amount, reason){
  const b = DATA.budgets.find(x=>x.dept===dept && x.category===category);
  if(!b) return null;
  b.allocated += amount;
  b.history.push({date:isoDate(TODAY), change:amount, reason});
  const pct = Math.round((b.allocated/b.approved)*100);
  if(pct>=85 && !b.thresholdAlerted){
    b.thresholdAlerted = true;
    notify('Finance / Budget Owner','Budget','⚠ '+dept+' '+category+' budget has reached '+pct+'% utilization (threshold: 85%) — remaining: '+fmt$(b.approved-b.allocated)+'.');
    addAudit('System','Budget threshold alert — '+dept+' '+category+' at '+pct+'% utilization', dept+' / '+category);
  }
  return b;
}


/* ---- CONTRACT EXPIRY ENGINE ---- */
const EXPIRY_ROLES_VIEW = ['Vendor Management','Legal','Finance / Budget Owner','Executive Management'];
const EXPIRY_ROLES_ACT = ['Vendor Management','Legal'];
const EXPIRY_NOTIFY_CHOICES = ['Vendor Management','Legal','Finance / Budget Owner','Executive Management'];
let EXPIRY_SCHEDULE = [
  {days:90, roles:['Vendor Management','Legal']},
  {days:60, roles:['Vendor Management','Legal']},
  {days:30, roles:['Vendor Management','Legal']},
  {days:7,  roles:['Vendor Management','Legal']}
];
const EXPIRY_DECISIONS = ['Renewal','Extension','Renegotiation','Closure'];
const BAND_PILL = {expired:'solid',critical:'red',warning:'amber',notice:'teal',watch:'grey',ok:'green'};
const BAND_NAME = {expired:'Expired',critical:'Critical',warning:'Expiring soon',notice:'Upcoming',watch:'On watch',ok:'Healthy'};

function scheduleDays(){ return EXPIRY_SCHEDULE.map(w=>w.days).sort((a,b)=>a-b); }
function expBands(){
  const w = scheduleDays();
  return [
    {key:'expired',  label:'Expired',                       test:d=>d<0},
    {key:'critical', label:'Within '+w[0]+' days',          test:d=>d>=0 && d<=w[0]},
    {key:'warning',  label:(w[0]+1)+'–'+w[1]+' days',       test:d=>d>w[0] && d<=w[1]},
    {key:'notice',   label:(w[1]+1)+'–'+w[2]+' days',       test:d=>d>w[1] && d<=w[2]},
    {key:'watch',    label:(w[2]+1)+'–'+w[3]+' days',       test:d=>d>w[2] && d<=w[3]},
    {key:'ok',       label:'Beyond '+w[3]+' days',          test:d=>d>w[3]}
  ];
}
function bandOf(days){ return expBands().find(b=>b.test(days)); }
function expirable(c){ return !!c.endDate && (c.status==='Active' || c.status==='Expired'); }
function durationText(c){ return fmtDate(c.startDate)+' → '+(c.endDate? fmtDate(c.endDate) : 'Continuous'); }
function recsOf(cid, type){ return DATA.prpo.filter(x=>x.contractId===cid && (!type || x.type===type)); }
function catPill(c){ return `<span class="pill ${c==='CAPEX'?'capex':'opex'}">${c}</span>`; }
function recPill(t){ return `<span class="pill ${t==='PR'?'grey':'teal'}">${t}</span>`; }
function canLinkRecs(){ return ['Procurement','Vendor Management'].includes(STATE.role); }
function setFilter(k, v){ STATE.filters[k] = v; renderAll(); }
function fsel(k, label, opts){
  const cur = STATE.filters[k] || '';
  return `<select onchange="setFilter('${k}',this.value)"><option value="">${label}: All</option>${opts.map(o=>{ const v = (typeof o==='object')? o.v : o, l = (typeof o==='object')? o.l : o; return `<option value="${v}" ${v===cur?'selected':''}>${l}</option>`; }).join('')}</select>`;
}
function daysLeft(c){ return daysBetween(TODAY, c.endDate); }
function addDays(dateStr, n){ return new Date(new Date(dateStr).getTime() + n*86400000); }
function timeLeftText(d){
  if(d<0) return 'Expired '+(-d)+(d===-1?' day':' days')+' ago';
  if(d===0) return 'Expires today';
  return d+(d===1?' day':' days')+' left';
}
function countdownPill(d){ const b = bandOf(d); return `<span class="pill ${BAND_PILL[b.key]}">${timeLeftText(d)}</span>`; }
function bandPill(d){ const b = bandOf(d); return `<span class="pill ${BAND_PILL[b.key]}">${BAND_NAME[b.key]}</span>`; }
function allNotifyRoles(){ const s = new Set(); EXPIRY_SCHEDULE.forEach(w=>w.roles.forEach(r=>s.add(r))); return [...s]; }
function relTime(ts){
  const d = daysBetween(ts, TODAY);
  if(d<=0) return 'Today'; if(d===1) return 'Yesterday'; if(d<7) return d+' days ago';
  return fmtDate(ts);
}

function checkExpiries(opts){
  opts = opts || {};
  let fired = 0;
  const sched = [...EXPIRY_SCHEDULE].sort((a,b)=>b.days-a.days);
  DATA.contracts.forEach(c=>{
    if(!expirable(c)) return;
    c.alertsSent = c.alertsSent || [];
    const days = daysLeft(c);
    const reached = sched.filter(w=>days<=w.days);
    const tightest = reached.length ? reached[reached.length-1] : null;
    reached.filter(w=>!c.alertsSent.some(a=>a.window===w.days)).forEach(w=>{
      const when = opts.backfill ? addDays(c.endDate, -w.days) : new Date(TODAY);
      const n = opts.backfill ? w.days : days;
      const sev = bandOf(n).key;
      const unread = !opts.backfill || (days>=0 && tightest && tightest.days===w.days);
      const title = w.days+'-day expiry notice';
      const msg = 'Contract '+c.contractNumber+' with '+c.vendorName+' expires in '+n+' days ('+fmtDate(c.endDate)+'). A renewal, extension, renegotiation or closure decision is needed.';
      w.roles.forEach(r=>notify(r,'Expiry',msg,{cid:c.id, sev, title, ts:when, read:!unread}));
      c.alertsSent.push({window:w.days, date:isoDate(when), roles:[...w.roles], kind:'scheduled'});
      addAudit('System','Expiry monitor: '+w.days+'-day notice sent to '+w.roles.join(', '), c.contractNumber, when);
      fired++;
    });
    if(days<0){
      if(c.status==='Active') c.status = 'Expired';
      if(!c.alertsSent.some(a=>a.window==='expired')){
        const when = opts.backfill ? addDays(c.endDate, 1) : new Date(TODAY);
        const roles = allNotifyRoles();
        const msg = 'Contract '+c.contractNumber+' with '+c.vendorName+' expired on '+fmtDate(c.endDate)+'. '+
          (c.expiryDecision ? 'Decision on record: '+c.expiryDecision.type+'.' : 'No renewal, extension, renegotiation or closure decision is on record.');
        roles.forEach(r=>notify(r,'Expiry',msg,{cid:c.id, sev:'expired', title:'Contract expired', ts:when, read:false}));
        c.alertsSent.push({window:'expired', date:isoDate(when), roles, kind:'expired'});
        addAudit('System','Expiry monitor: contract reached its end date and is now Expired', c.contractNumber, when);
        fired++;
      }
    }
  });
  if(fired){
    DATA.notifications.sort((a,b)=>new Date(b.ts)-new Date(a.ts));
    DATA.audit.sort((a,b)=>new Date(b.ts)-new Date(a.ts));
  }
  return fired;
}

function advanceDays(n){
  TODAY = new Date(TODAY.getTime() + n*86400000);
  const fired = checkExpiries({}) + (LEAN ? checkPoWatch({}) : 0);
  renderAll();
  toast(fired ? fired+' new expiry '+(fired===1?'alert':'alerts')+' · '+fmtDate(TODAY) : fmtDate(TODAY));
}

function reminderChips(c){
  const sched = [...EXPIRY_SCHEDULE].sort((a,b)=>b.days-a.days);
  const d = daysLeft(c);
  return sched.map(w=>{
    const s = (c.alertsSent||[]).find(a=>a.window===w.days);
    if(s) return `<span class="chip sent" title="Sent ${fmtDate(s.date)} to ${s.roles.join(', ')}">✓ ${w.days}d</span>`;
    if(d<0) return `<span class="chip skip" title="Not sent">– ${w.days}d</span>`;
    return `<span class="chip pending" title="Scheduled for ${fmtDate(addDays(c.endDate,-w.days))}">○ ${w.days}d</span>`;
  }).join('');
}
function nextReminderText(c){
  const d = daysLeft(c);
  if(d<0) return 'Past end date';
  const pending = [...EXPIRY_SCHEDULE].filter(w=>!(c.alertsSent||[]).some(a=>a.window===w.days) && w.days<d).sort((a,b)=>b.days-a.days)[0];
  if(!pending) return 'All scheduled reminders sent';
  return 'Next: '+pending.days+'-day notice on '+fmtDate(addDays(c.endDate,-pending.days));
}

/* ---- Decisions, acknowledgement, manual reminder ---- */
function openDecision(cid){
  const c = DATA.contracts.find(x=>x.id===cid); if(!c) return;
  const cur = c.expiryDecision;
  showModal(`
    <span class="close" onclick="closeModal()">✕</span>
    <h3>Record expiry decision</h3>
    <div class="note" style="margin-bottom:6px"><b>${c.contractNumber}</b> · ${c.vendorName} · ${timeLeftText(daysLeft(c))} (${fmtDate(c.endDate)})</div>
    <label class="f">Decision</label>
    <select id="dcType" class="fld"><option value="">Select…</option>${EXPIRY_DECISIONS.map(x=>`<option ${cur&&cur.type===x?'selected':''}>${x}</option>`).join('')}</select>
    <label class="f">Follow-up owner</label>
    <select id="dcOwner" class="fld">${['Vendor Management','Legal','Procurement','Technology Department','Finance / Budget Owner'].map(r=>`<option ${(cur?cur.owner:STATE.role)===r?'selected':''}>${r}</option>`).join('')}</select>
    <label class="f">Note</label>
    <textarea id="dcNote" placeholder="Context for the decision, next step, vendor discussion…">${cur?cur.note:''}</textarea>
    <div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end">
      <button class="btn secondary" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="saveDecision('${c.id}')">Save decision</button>
    </div>`);
}
function saveDecision(cid){
  const c = DATA.contracts.find(x=>x.id===cid);
  const type = document.getElementById('dcType').value;
  if(!type){ toast('Select a decision to continue.','error'); return; }
  const owner = document.getElementById('dcOwner').value;
  const note = document.getElementById('dcNote').value.trim();
  c.expiryDecision = {type, owner, note, date:isoDate(TODAY), by:STATE.role};
  addAudit(STATE.role,'Recorded expiry decision: '+type+' (follow-up: '+owner+')', c.contractNumber);
  allNotifyRoles().filter(r=>r!==STATE.role).forEach(r=>notify(r,'Expiry','Decision recorded for '+c.contractNumber+' ('+c.vendorName+'): '+type+'. Follow-up owner: '+owner+'.',{cid:c.id, sev:'ok', title:'Expiry decision recorded'}));
  closeModal(); renderAll(); toast('Decision recorded — '+type);
}
function acknowledgeExpiry(cid){
  const c = DATA.contracts.find(x=>x.id===cid);
  c.ack = {by:STATE.role, date:isoDate(TODAY)};
  addAudit(STATE.role,'Acknowledged expiry alert', c.contractNumber);
  renderAll(); toast('Alert acknowledged');
}
function sendExpiryReminder(cid){
  const c = DATA.contracts.find(x=>x.id===cid);
  const d = daysLeft(c);
  const roles = allNotifyRoles();
  const msg = 'Reminder: '+c.contractNumber+' with '+c.vendorName+' — '+timeLeftText(d).toLowerCase()+'. A renewal, extension, renegotiation or closure decision is needed.';
  roles.forEach(r=>notify(r,'Expiry',msg,{cid:c.id, sev:bandOf(d).key, title:'Expiry reminder'}));
  (c.alertsSent = c.alertsSent||[]).push({window:'manual', date:isoDate(TODAY), roles, kind:'manual'});
  addAudit(STATE.role,'Sent additional expiry reminder', c.contractNumber);
  renderAll(); toast('Reminder sent to '+roles.join(' and '));
}
function setExpFilter(key){ STATE.expFilter = (STATE.expFilter===key) ? '' : key; renderAll(); }
function openExpiry(key){ go('expiry', key); }

function saveSchedule(){
  const rows = [];
  for(let i=0;i<EXPIRY_SCHEDULE.length;i++){
    const days = Number(document.getElementById('sch_d_'+i).value);
    const roles = EXPIRY_NOTIFY_CHOICES.filter((r,j)=>document.getElementById('sch_r_'+i+'_'+j).checked);
    if(!Number.isInteger(days) || days<1){ toast('Each reminder needs a whole number of days.','error'); return; }
    if(!roles.length){ toast('Choose at least one role to notify for every reminder.','error'); return; }
    rows.push({days, roles});
  }
  if(new Set(rows.map(r=>r.days)).size !== rows.length){ toast('Reminder days must be different from each other.','error'); return; }
  EXPIRY_SCHEDULE = rows.sort((a,b)=>b.days-a.days);
  addAudit(STATE.role,'Updated expiry reminder schedule ('+EXPIRY_SCHEDULE.map(w=>w.days+'d').join(' / ')+')','Expiry settings');
  const fired = checkExpiries({});
  renderAll(); toast('Reminder schedule saved'+(fired?' · '+fired+' new '+(fired===1?'alert':'alerts')+' raised':''));
}

/* ---- Toast ---- */
let TOAST_TIMER = null;
function toast(msg, kind){
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.className = 'toast' + (kind==='error' ? ' err' : '');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(TOAST_TIMER);
  TOAST_TIMER = setTimeout(()=>{ t.style.display='none'; }, 3600);
}

/* ---- Notification helpers ---- */
function markRead(id){ const n = DATA.notifications.find(x=>x.id===id); if(n){ n.read = true; } renderAll(); }
function markAllRead(){ DATA.notifications.filter(n=>n.forRole===STATE.role).forEach(n=>n.read=true); renderAll(); }
function setNotifFilter(t){ STATE.notifFilter = (STATE.notifFilter===t)?'':t; renderAll(); }
function openNotif(id){
  const n = DATA.notifications.find(x=>x.id===id); if(!n) return;
  n.read = true; BELL_OPEN = false;
  if(n.cid) go('contractDetail', n.cid); else if(n.pid) go('poDoc', n.pid); else go('notifications');
}

/* ---- Bell panel ---- */
let BELL_OPEN = false;
function toggleBell(e){ if(e) e.stopPropagation(); BELL_OPEN = !BELL_OPEN; renderBell(); }
document.addEventListener('click', e=>{
  if(BELL_OPEN && !e.target.closest('#bellPanel') && !e.target.closest('.bell')){ BELL_OPEN = false; renderBell(); }
});
function renderBell(){
  let p = document.getElementById('bellPanel');
  if(!p){ p = document.createElement('div'); p.id = 'bellPanel'; p.className = 'bellpanel'; document.querySelector('.topbar-right').appendChild(p); }
  if(!BELL_OPEN){ p.style.display = 'none'; return; }
  const mine = DATA.notifications.filter(n=>n.forRole===STATE.role);
  const unread = mine.filter(n=>!n.read).length;
  const rank = {expired:0,critical:1,warning:2,notice:3,watch:4};
  const list = [...mine].sort((a,b)=>(a.read-b.read)||((rank[a.sev]??5)-(rank[b.sev]??5))||(new Date(b.ts)-new Date(a.ts))).slice(0,7);
  p.style.display = 'block';
  p.innerHTML = `
    <div class="bp-head"><b>Notifications</b> <span class="note">${unread? unread+' unread':'All read'}</span>
      <a onclick="markAllRead()" class="bp-link" style="margin-left:auto">Mark all read</a></div>
    ${list.length? list.map(n=>`<div class="bp-item ${n.read?'':'unread'}" onclick="openNotif('${n.id}')">
      <span class="sevdot sev-${n.sev||'none'}"></span>
      <div style="flex:1"><div class="bp-title">${n.title || n.type}</div><div class="bp-msg">${n.message}</div><div class="note">${relTime(n.ts)}${n.cid?' · Open contract':(n.pid?' · Open PO':'')}</div></div>
    </div>`).join('') : '<div class="empty">No notifications yet.</div>'}
    <div class="bp-foot"><a class="bp-link" onclick="BELL_OPEN=false;go('notifications')">Open Notification Center</a>
    ${EXPIRY_ROLES_VIEW.includes(STATE.role)? '<a class="bp-link" onclick="BELL_OPEN=false;openExpiry(\'\')">Open Contract Expiry Center</a>':''}${LEAN && STATE.role==='Procurement' ? '<a class="bp-link" onclick="BELL_OPEN=false;openMonitor(\'\')">Open PO Monitoring</a>':''}</div>`;
}

/* ---- Global strip ---- */
function renderExpiryStrip(){
  if(LEAN) return renderPoStrip();
  if(!EXPIRY_ROLES_VIEW.includes(STATE.role) || STATE.page==='expiry') return '';
  const list = DATA.contracts.filter(expirable).map(daysLeft);
  const w = scheduleDays();
  const ex = list.filter(d=>d<0).length, cr = list.filter(d=>d>=0 && d<=w[0]).length, wa = list.filter(d=>d>w[0] && d<=w[1]).length;
  if(!ex && !cr && !wa) return '';
  const parts = [];
  if(ex) parts.push(ex+' contract'+(ex>1?'s':'')+' expired');
  if(cr) parts.push(cr+' expiring within '+w[0]+' days');
  if(wa) parts.push(wa+' more within '+w[1]+' days');
  return `<div class="expstrip ${(ex||cr)?'hot':''}" onclick="openExpiry('')"><span class="sevdot sev-${ex?'expired':(cr?'critical':'warning')}"></span><b>${parts.join(' · ')}</b><span class="lnk">Review in Contract Expiry Center →</span></div>`;
}

/* ---- Tiles (shared by Dashboard and Expiry Center) ---- */
function expiryCounts(){
  const list = DATA.contracts.filter(expirable).map(c=>({c, d:daysLeft(c)}));
  const counts = {}; expBands().forEach(b=>counts[b.key] = list.filter(x=>b.test(x.d)).length);
  return {list, counts};
}
function renderExpiryTiles(onclickFn){
  const {counts} = expiryCounts();
  return `<div class="tiles">${expBands().map(b=>`<div class="tile ${b.key} ${STATE.expFilter===b.key && STATE.page==='expiry'?'active':''}" onclick="${onclickFn}('${b.key}')">
    <div class="n">${counts[b.key]}</div><div class="l">${b.key==='expired'?'Expired':(b.key==='ok'?'Beyond '+scheduleDays()[3]+' days':b.label)}</div></div>`).join('')}</div>`;
}
function renderExpiryWatch(){
  if(!EXPIRY_ROLES_VIEW.includes(STATE.role)) return '';
  const {list} = expiryCounts();
  const w = scheduleDays();
  const urgent = list.filter(x=>x.d<=w[1]).sort((a,b)=>a.d-b.d).slice(0,4);
  return `<div class="card">
    <div class="flex-between"><h3 style="margin:0">Contract Expiry Watch</h3><button class="btn secondary small" onclick="openExpiry('')">Open Contract Expiry Center</button></div>
    <div style="margin-top:12px">${renderExpiryTiles('openExpiry')}</div>
    ${urgent.length? urgent.map(x=>`<div class="watchrow" onclick="go('contractDetail','${x.c.id}')">
      <span class="sevdot sev-${bandOf(x.d).key}"></span>

      ${countdownPill(x.d)}</div>`).join('') : '<div class="note" style="margin-top:6px">No contracts end within the next '+w[1]+' days.</div>'}
  </div>`;
}

/* ---- Timeline ---- */
function renderExpiryTimeline(items){
  const MIN = -30, MAX = 120, span = MAX-MIN;
  const pos = d=>Math.max(0, Math.min(100, ((d-MIN)/span)*100));
  const w = scheduleDays();
  const cuts = [MIN, 0, w[0], w[1], w[2], w[3], MAX];
  const cls = ['b-exp','b-crit','b-warn','b-note','b-watch','b-ok'];
  const bands = cls.map((k,i)=>`<div class="${k}" style="width:${pos(cuts[i+1])-pos(cuts[i])}%"></div>`).join('');
  const ticks = [{d:0,t:'Today'}].concat(w.map(x=>({d:x,t:x+'d'})));
  const colors = {expired:'#b3261e',critical:'#e0554b',warning:'#c77a1c',notice:'#e6b700',watch:'#8a9aaa',ok:'#1e7d4c'};
  return `<div class="tl"><div class="tl-track">
    <div class="tl-axis">${ticks.map(t=>`<span style="left:${pos(t.d)}%">${t.t}</span>`).join('')}</div>
    <div class="tl-bands">${bands}</div>
    <div class="tl-today" style="left:${pos(0)}%"></div>
    ${items.map(({c,d})=>{
      const b = bandOf(d), start = Math.max(MIN, daysBetween(TODAY, c.startDate));
      const left = pos(start), right = pos(d), clipped = d>MAX;
      const flip = right>78;
      return `<div class="tl-row" onclick="go('contractDetail','${c.id}')" title="${c.contractNumber} · ${c.vendorName} — ends ${fmtDate(c.endDate)} (${timeLeftText(d)})">
        <div class="tl-label"><b>${c.contractNumber}</b><span>${c.vendorName}</span></div>
        <div class="tl-bar ${b.key==='expired'?'hatch':''}" style="left:${left}%;width:${Math.max(0.8,right-left)}%;background:${colors[b.key]}"></div>
        <div class="tl-end" style="left:${right}%;background:${colors[b.key]}"></div>
        <div class="tl-txt ${flip?'flip':''}" style="${flip?'top:-3px;right:'+(100-right-1)+'%':'left:'+(right+1.2)+'%'}">${clipped?'':fmtDate(c.endDate)+' · '}${timeLeftText(d)}</div>
      </div>`;}).join('')}
  </div></div>`;
}

/* ---- Expiry Center ---- */

  const canAct = EXPIRY_ROLES_ACT.includes(STATE.role);
  const {list} = expiryCounts();
  const sorted = [...list].sort((a,b)=>a.d-b.d);
  const f = STATE.expFilter || '';
  const bands = expBands();
  const shown = f ? sorted.filter(x=>bandOf(x.d).key===f) : sorted;
  const rowHtml = ({c,d})=>{
    const b = bandOf(d);
    const dec = c.expiryDecision;
    const needs = b.key!=='ok';
    return `<tr>
      <td><b>${c.contractNumber}</b><br><span class="note">${c.vendorName} · ${c.department}</span><br><span class="note">Owner: ${c.contractOwner||'—'}</span></td>
      <td>${fmtDate(c.endDate)}</td>
      <td>${countdownPill(d)}</td>
      <td>${reminderChips(c)}<div class="note">${nextReminderText(c)}</div></td>
      <td>${dec? `<span class="pill green">${dec.type}</span><div class="note">${dec.owner} · ${fmtDate(dec.date)}</div>`
               : (needs? `<span class="pill amber">No decision yet</span>${c.ack?`<div class="note">Seen by ${c.ack.by} · ${fmtDate(c.ack.date)}</div>`:''}` : '<span class="note">—</span>')}</td>
      <td><div class="actcol">
        <button class="btn small secondary" onclick="go('contractDetail','${c.id}')">Open</button>
        ${canAct && needs? `<button class="btn small" onclick="openDecision('${c.id}')">${dec?'Update decision':'Record decision'}</button>`:''}
        ${canAct && needs && !dec && !c.ack? `<button class="btn small secondary" onclick="acknowledgeExpiry('${c.id}')">Acknowledge</button>`:''}
        ${canAct && needs && !dec? `<button class="btn small secondary" onclick="sendExpiryReminder('${c.id}')">Send reminder</button>`:''}
      </div></td></tr>`;
  };
  const groups = bands.map(b=>({b, rows:shown.filter(x=>bandOf(x.d).key===b.key)})).filter(g=>g.rows.length);
  return `
  ${pageHeader('Contract Expiry Center','Every active contract tracked against its end date. Reminders go out automatically ahead of expiry — at least 30 days prior — so renewal, extension, renegotiation or closure is decided in time.')}
  ${renderExpiryTiles('setExpFilter')}
  <div class="card">
    <div class="flex-between"><h3 style="margin:0">Expiry timeline</h3><span class="note">Next 120 days · click a contract to open it</span></div>
    ${sorted.length? renderExpiryTimeline(sorted) : '<div class="empty">No active contracts.</div>'}
  </div>
  <div class="card">
    <div class="flex-between"><h3 style="margin:0">Contracts by urgency ${f?`<span class="pill grey" style="margin-left:6px">${bands.find(b=>b.key===f).label}</span>`:''}</h3>
      ${f? '<button class="btn secondary small" onclick="setExpFilter(\''+f+'\')">Clear filter</button>':''}</div>
    ${groups.length? `<table><thead><tr><th>Contract</th><th>End date</th><th>Time left</th><th>Reminders</th><th>Decision</th><th></th></tr></thead><tbody>
      ${groups.map(g=>`<tr class="grouphead"><td colspan="6"><span class="sevdot sev-${g.b.key}"></span> ${g.b.key==='expired'?BAND_NAME.expired:BAND_NAME[g.b.key]+' · '+g.b.label} <span class="note">(${g.rows.length})</span></td></tr>${g.rows.map(rowHtml).join('')}`).join('')}
    </tbody></table>` : '<div class="empty">No contracts in this group.</div>'}
  </div>
  ${renderContinuousCard()}
  ${renderScheduleCard()}`;
}
function renderContinuousCard(){
  const list = DATA.contracts.filter(c=>c.termType==='Continuous' && !c.endDate);

  return `<div class="card">
    <div class="flex-between"><h3 style="margin:0">Continuous contracts <span class="note">· ${list.length}</span></h3></div>

      <td><button class="btn small secondary" onclick="go('contractDetail','${c.id}')">Open</button></td></tr>`).join('')}

function renderScheduleCard(){

    <table><thead><tr><th>Reminder</th><th>Days before end date</th><th>Notify</th></tr></thead><tbody>
    ${sorted.map((w,i)=>`<tr><td>Notice ${i+1}</td>

      <td>${EXPIRY_NOTIFY_CHOICES.map((r,j)=>`<label class="chk"><input type="checkbox" id="sch_r_${i}_${j}" ${w.roles.includes(r)?'checked':''} ${canEdit?'':'disabled'}> ${r}</label>`).join('')}</td></tr>`).join('')}
    </tbody></table></div>`;
}

/* ---- Contract detail: expiry panel ---- */
function renderExpiryPanel(c){
  if(!expirable(c)) return '';
  const d = daysLeft(c), b = bandOf(d), dec = c.expiryDecision;
  const canAct = EXPIRY_ROLES_ACT.includes(STATE.role);
  const total = Math.max(1, daysBetween(c.startDate, c.endDate));
  const pct = Math.min(100, Math.max(0, Math.round(daysBetween(c.startDate, TODAY)/total*100)));
  const bannerCls = (b.key==='expired'||b.key==='critical') ? 'red' : (b.key==='ok' ? 'green' : 'amber');
  const msg = b.key==='expired' ? 'This contract expired on '+fmtDate(c.endDate)+' ('+(-d)+(d===-1?' day':' days')+' ago).'
            : (b.key==='ok' ? 'Active until '+fmtDate(c.endDate)+' — '+d+' days left. No action needed yet.'
            : 'Ends on '+fmtDate(c.endDate)+' — '+timeLeftText(d)+'.');
  const decTxt = dec ? ' Decision on record: <b>'+dec.type+'</b> (follow-up: '+dec.owner+', '+fmtDate(dec.date)+').'
                : (b.key==='ok' ? '' : ' No renewal, extension, renegotiation or closure decision is on record.');
  const colors = {expired:'#b3261e',critical:'#e0554b',warning:'#c77a1c',notice:'#e6b700',watch:'#8a9aaa',ok:'#1e7d4c'};
  const sent = [...(c.alertsSent||[])].sort((a,z)=>new Date(a.date)-new Date(z.date));
  const pending = d<0 ? [] : [...EXPIRY_SCHEDULE].filter(w=>!sent.some(a=>a.window===w.days)).sort((a,z)=>z.days-a.days);
  return `<div class="card expcard ${b.key}">
    <div class="flex-between"><h3 style="margin:0">Expiry &amp; renewal</h3>
      <div style="display:flex;gap:8px">${canAct && b.key!=='ok'? `<button class="btn small" onclick="openDecision('${c.id}')">${dec?'Update decision':'Record decision'}</button>${!dec?`<button class="btn small secondary" onclick="sendExpiryReminder('${c.id}')">Send reminder</button>`:''}`:''}</div></div>
    <div class="banner ${bannerCls}" style="margin:12px 0">${msg}${decTxt}</div>
    <div class="termbar"><div class="fill" style="width:${pct}%;background:${colors[b.key]}"></div><div class="mk" style="left:${pct}%"><span>Today</span></div></div>
    <div class="flex-between note"><span>Start · ${fmtDate(c.startDate)}</span><span>${pct}% of term elapsed</span><span>End · ${fmtDate(c.endDate)}</span></div>
    <h3 style="margin:16px 0 6px;font-size:13px">Alert trail</h3>
    <div class="trail">
      ${sent.map(a=>`<div class="trow"><span class="tdot done"></span><div><b>${a.window==='expired'?'Expiry notice':(a.window==='manual'?'Manual reminder':a.window+'-day notice')}</b> · ${fmtDate(a.date)}<div class="note">Sent to ${a.roles.join(', ')}</div></div></div>`).join('')}
      ${pending.map(w=>`<div class="trow"><span class="tdot"></span><div><b>${w.days}-day notice</b> · scheduled ${fmtDate(addDays(c.endDate,-w.days))}<div class="note">Will be sent to ${w.roles.join(', ')}</div></div></div>`).join('')}
      ${!sent.length && !pending.length? '<div class="note">No alerts yet.</div>':''}
    </div>
  </div>`;
}

  n = Number(n)||0;
  if(n>=1e6){ const v = n/1e6; return '$'+(Math.round(v*10)/10)+'M'; }
  if(n>=1e3){ const v = n/1e3; return '$'+(v>=100? Math.round(v) : Math.round(v*10)/10)+'K'; }

function lineAmt(l){ return num(l.qty) * num(l.rate); }
function docTotals(x){
  const lines = x.lines || [];
  const sub = lines.reduce((a,l)=>a+lineAmt(l),0);
  const vat = lines.reduce((a,l)=>a+lineAmt(l)*num(l.taxRate)/100,0);
  const disc = num(x.discount);
  return {sub, disc, vat, total: sub - disc + vat};
}

  DATA.contracts.filter(c=>!c.requestId && c.prNumber).forEach(c=>{

  mkPO(mp('PO-2026-0327'),'Core Network Fiber Expansion — additional passive materials','Network Operations','CAPEX','2026-08-10',42000,V('V-05'),{contractId:cn('MTN-CM-2026-0311').id});

  mkPO(mp('PO-2026-0033'),'Billing Platform Support — additional user licences','Technology','OPEX','2026-03-09',16800,V('V-02'),{contractId:cn('MTN-CM-2025-0204').id});
  // Purchases that were completed with a PO only (no contract)
  const p1 = mkPR('PR-2026-0120','Network monitoring licences renewal','Technology','OPEX','2026-03-02',18000,{status:'PO Issued'});
  mkPO('POSD100303',p1.title,'Technology','OPEX','2026-03-12',18000,V('V-02'),{prId:p1.id,reference:p1.number});
  const p2 = mkPR('PR-2026-0127','Fibre splicing toolkit','Network Operations','CAPEX','2026-04-06',12400,{status:'PO Issued'});
  mkPO('POSD100318',p2.title,'Network Operations','CAPEX','2026-04-15',12400,V('V-03'),{prId:p2.id,reference:p2.number});
  const p3 = mkPR('PR-2026-0133','Retail outlet signage','Marketing','OPEX','2026-05-11',9800,{status:'PO Issued'});
  mkPO('POSD100329',p3.title,'Marketing','OPEX','2026-05-20',9800,V('V-04'),{prId:p3.id,reference:p3.number});

  mkPO('POSD100338',p4.title,'Customer Experience','OPEX','2026-06-30',7500,V('V-01'),{prId:p4.id,reference:p4.number});

  mkPO(mp('PO-2026-0274'),'Retail outlet connectivity — site survey','Marketing','OPEX','2026-08-06',6400,V('V-04'));
  mkPO(mp('PO-2026-0281'),'Data centre cooling maintenance','Technology','OPEX','2026-08-13',14900,V('V-01'));

  // Requester's own draft and a returned PR
  mkPR('PR-2026-0175','Branch Wi-Fi refresh','Technology','CAPEX','2026-08-30',22000,{status:'Draft'});
  mkPR('PR-2026-0168','Office printer fleet replacement','Technology','CAPEX','2026-08-21',15500,{status:'Returned', returnReason:'The specification of the items needs more detail.'});
  /* v1.4 — PR estimate vs PO value, discounts and delivery. The estimate of a PR that has no request is set from its PO. */
  const fcyc = [0.96, 1.0, 0.93, 1.04, 0.97, 0.91, 1.02, 0.95, 1.0, 0.98];
  let fi = 0;
  DATA.prpo.filter(x=>x.type==='PO').sort((a,b)=>new Date(a.date)-new Date(b.date) || a.number.localeCompare(b.number)).forEach((po,i)=>{
    const sub = po.lines.reduce((a,l)=>a+lineAmt(l),0), pr = po.prId ? recById(po.prId) : null;
    if(i%3===1 && !po.requestId) po.discount = Math.round(sub*0.02/10)*10;
    if(pr && !pr.requestId){ const f = fcyc[fi++ % fcyc.length]; oneLine(pr, Math.round(sub/f/100)*100); }
  });
  const offs = [0, 0, 4, 0, 7, 0, 2, 0, 3];
  let oi = 0;
  DATA.prpo.filter(x=>x.type==='PO' && x.deliveryDate && new Date(x.deliveryDate) < TODAY).sort((a,b)=>a.deliveryDate.localeCompare(b.deliveryDate)).forEach(po=>{

  });
  syncPrContracts();
}

/* ===================== v1.3 — PR PORTAL ===================== */
function canRaisePR(){ return STATE.role === 'Technology Department'; }
function isProc(){ return STATE.role === 'Procurement'; }
function prStatusPill(s){ const m = {Draft:'grey', Submitted:'amber', Returned:'red', 'PO Issued':'green'}; return `<span class="pill ${m[s]||'grey'}">${s}</span>`; }
function reqOfRec(x){ return (!LEAN && x.requestId) ? DATA.requests.find(r=>r.id===x.requestId) : null; }
function prReady(x){ const r = reqOfRec(x); return !r || r.currentStep === 10; }
function setPrTab(t){ STATE.prTab = t; renderAll(); }
function setPoTab(t){ STATE.poTab = t; renderAll(); }
function stepText(r){ return r.currentStep + '/' + ((r.noContract || r.contractAttached) ? 11 : 14); }
function contractLink(cid){ const c = DATA.contracts.find(y=>y.id===cid); return c ? `<a class="bp-link" onclick="event.stopPropagation();go('contractDetail','${c.id}')">${c.contractNumber}</a>` : ''; }
function poLinkOfPr(x){
  const pos = poOfPr(x.id);
  return pos.length ? pos.map(p=>`<a class="bp-link" onclick="event.stopPropagation();go('poDoc','${p.id}')">${p.number}</a>`).join(', ') : '<span class="note">—</span>';
}


function portalActions(role, re){
  const items = computeActionItems(role).filter(it=>re.test(it.onclick));

  return `<div class="card" style="border-color:#c77a1c;background:linear-gradient(180deg,#fdf1e0 0%,#fff 60px)">
    <div class="flex-between"><h3 style="margin:0;color:#c77a1c">🟠 Needs Your Action — ${items.length}</h3></div>
    ${items.map(it=>`<div class="rowlink" onclick="${it.onclick}" style="padding:9px 4px;border-bottom:1px solid #f0e2c8;cursor:pointer"><b>${it.label}</b> ${it.urgent?'<span class="pill red">Priority</span>':''}<br><span class="note">${it.sub}</span></div>`).join('')}
  </div>`;
}

function renderPrDetail(){
  const x = recById(STATE.selRec);
  if(!x || x.type!=='PR') return '<div class="empty">Purchase requisition not found.</div>';
  const r = reqOfRec(x), pos = poOfPr(x.id), t = docTotals(x);
  const back = isProc() ? 'poportal' : 'prportal';
  const flow = ['Draft','Submitted','PO Issued'];
  const idx = x.status==='Returned' ? 1 : flow.indexOf(x.status);
  const stepper = flow.map((s,i)=>`<div class="step ${i<idx?'done':(i===idx?'current':'')}"><span class="n">${i+1}</span>${s==='PO Issued'?'PO issued':s}</div>`).join('');
  let action = '';
  if(x.status==='Draft' && canRaisePR()){
    action = `<button class="btn" onclick="submitPrFromDetail('${x.id}')">Submit to Procurement</button> <button class="btn secondary" onclick="openPrForm('${x.id}')">Edit</button>`;
  } else if(x.status==='Returned'){
    action = `<div class="banner red">Returned by Procurement: ${esc(x.returnReason||'—')}</div>` +
      (canRaisePR() ? `<button class="btn" onclick="openPrForm('${x.id}')">Edit &amp; resubmit</button>` : '');
  } else if(x.status==='Submitted'){
    if(isProc()){
      if(prReady(x)) action = `<button class="btn" onclick="openPoForm({prId:'${x.id}'${(!LEAN && x.requestId)?`,reqId:'${x.requestId}'`:''}})">Create PO from this PR</button> ${(!LEAN && x.requestId)?'':`<button class="btn secondary" onclick="openReturnPr('${x.id}')">Return to requester</button>`}`;
      else action = `<div class="banner amber">This PR belongs to request ${r.id}, which is at step ${r.currentStep} of the process. The PO is created at step 11.</div><button class="btn secondary" onclick="go('requestDetail','${r.id}')">Open request →</button>`;
    } else action = `<div class="banner amber">Waiting for Procurement to issue a purchase order.</div>`;
  } else if(x.status==='PO Issued'){
    action = pos.map(p=>`<button class="btn secondary" onclick="go('poDoc','${p.id}')">View ${p.number} →</button>`).join(' ');
  }
  return `
  <span class="back" onclick="go('${back}')">← Back to ${isProc()?'PO Portal':'PR Portal'}</span>
  <h1 class="pageTitle">${x.number} · ${esc(x.title)}</h1>
  <p class="pageSub">${x.department} · ${catPill(x.category)} · ${prStatusPill(x.status)}</p>
  <div class="stepper">${stepper}</div>
  <div class="grid cols2">
    <div class="card">
      <h3>Requisition</h3>
      <div class="kv">
        <b>PR number</b><span>${x.number}</span>
        <b>Raised</b><span>${fmtDate(x.date)}</span>
        <b>Business unit</b><span>${x.department}</span>
        <b>Category</b><span>${x.category}${x.budgetCode?' · budget '+esc(x.budgetCode):''}</span>
        <b>Reference</b><span>${esc(x.reference)||'—'}</span>
        <b>Needed by</b><span>${x.neededBy? fmtDate(x.neededBy):'—'}</span>
        ${LEAN?'':`<b>Request</b><span>${r? `<a class="bp-link" onclick="go('requestDetail','${r.id}')">${r.id}</a>` : '—'}</span>`}
        <b>Purchase order</b><span>${poLinkOfPr(x)}</span>
        <b>Contract</b><span>${x.contractId? contractLink(x.contractId) : '—'}</span>
      </div>
      <div style="margin-top:14px">${action}</div>
    </div>
    <div class="card">
      <h3>History</h3>
      ${[...x.hist].reverse().map(h=>`<div style="padding:8px 0;border-bottom:1px solid #eef1f4"><b>${esc(h.text)}</b><br><span class="note">${fmtDate(h.date)} · ${h.actor}</span></div>`).join('') || '<div class="empty">No history yet.</div>'}
    </div>
  </div>
  <div class="card">
    <h3>Items</h3>
    ${linesTable(x, false)}
    <div class="totalsbox"><div><span>Estimated total</span><b>${fmtMoney(t.total)}</b></div></div>
  </div>`;
}

function linesTable(x, withTax){
  const L = x.lines || [];
  if(!L.length) return '<div class="empty">No items recorded.</div>';
  return `<table><thead><tr><th>Item</th><th>Description</th><th style="text-align:right">Qty</th><th>Unit</th><th style="text-align:right">Rate</th>${withTax?'<th style="text-align:right">Tax rate</th>':''}<th style="text-align:right">Amount</th></tr></thead><tbody>
  ${L.map(l=>`<tr><td><b>${esc(l.item)}</b></td><td>${esc(l.desc)}</td><td style="text-align:right">${l.qty}</td><td>${esc(l.unit)}</td><td style="text-align:right">${fmtNum2(l.rate)}</td>${withTax?`<td style="text-align:right">${l.taxRate? l.taxRate+'%':''}</td>`:''}<td style="text-align:right">${fmtNum2(lineAmt(l))}</td></tr>`).join('')}
  </tbody></table>`;
}

/* ---- line editor shared by the PR and PO forms ---- */
function lineRowHtml(l, tax){
  return `<tr class="ln-row"><td><input type="text" class="ln-item" value="${esc(l.item)}" placeholder="Item"></td>
  <td><input type="text" class="ln-desc" value="${esc(l.desc)}" placeholder="Description"></td>
  <td style="width:62px"><input type="number" class="ln-qty" value="${l.qty}" min="0" oninput="updateLineTotals()"></td>
  <td style="width:58px"><input type="text" class="ln-unit" value="${esc(l.unit)}"></td>
  <td style="width:96px"><input type="number" class="ln-rate" value="${l.rate}" min="0" step="0.01" oninput="updateLineTotals()"></td>
  ${tax?`<td style="width:64px"><input type="number" class="ln-tax" value="${l.taxRate||0}" min="0" step="0.1" oninput="updateLineTotals()"></td>`:''}
  <td class="ln-amt" style="text-align:right;white-space:nowrap;width:92px">0.00</td><td style="width:22px"><span class="rm" onclick="removeLineRow(this)">✕</span></td></tr>`;
}
function lineEditor(lines, tax){
  return `<table class="lntable"><thead><tr><th>Item</th><th>Description</th><th>Qty</th><th>Unit</th><th>Rate</th>${tax?'<th>Tax %</th>':''}<th style="text-align:right">Amount</th><th></th></tr></thead>
  <tbody id="lnBody">${lines.map(l=>lineRowHtml(l,tax)).join('')}</tbody></table>
  <button class="btn secondary small" style="margin-top:6px" onclick="addLineRow(${tax?'true':'false'})">+ Add item</button>`;
}
function addLineRow(tax){ document.getElementById('lnBody').insertAdjacentHTML('beforeend', lineRowHtml({item:'',desc:'',qty:1,unit:'Ea',rate:'',taxRate:0}, tax)); updateLineTotals(); }
function removeLineRow(el){ const tr = el.closest('tr'); if(document.querySelectorAll('.ln-row').length>1){ tr.remove(); updateLineTotals(); } }
function readLines(){
  return Array.from(document.querySelectorAll('.ln-row')).map(tr=>({
    item: tr.querySelector('.ln-item').value.trim(), desc: tr.querySelector('.ln-desc').value.trim(),
    qty: num(tr.querySelector('.ln-qty').value), unit: tr.querySelector('.ln-unit').value.trim()||'Ea',
    rate: num(tr.querySelector('.ln-rate').value), taxRate: tr.querySelector('.ln-tax') ? num(tr.querySelector('.ln-tax').value) : 0
  })).filter(l=>(l.item||l.desc) && l.qty>0 && l.rate>0);
}
function updateLineTotals(){
  let sub = 0, vat = 0;
  document.querySelectorAll('.ln-row').forEach(tr=>{
    const a = num(tr.querySelector('.ln-qty').value) * num(tr.querySelector('.ln-rate').value);
    const tx = tr.querySelector('.ln-tax') ? num(tr.querySelector('.ln-tax').value) : 0;
    tr.querySelector('.ln-amt').textContent = fmtNum2(a); sub += a; vat += a*tx/100;
  });
  const dEl = document.getElementById('poDisc'), disc = dEl ? num(dEl.value) : 0;
  const el = document.getElementById('lnTotals');
  if(el) el.innerHTML = (dEl ? `<div><span>Subtotal</span><b>${fmtMoney(sub)}</b></div><div><span>Discount</span><b>− ${fmtMoney(disc)}</b></div><div><span>VAT</span><b>${fmtMoney(vat)}</b></div><div class="tt"><span>Total</span><b>${fmtMoney(sub-disc+vat)}</b></div>` : `<div class="tt"><span>Estimated total</span><b>${fmtMoney(sub)}</b></div>`);
}

function savePr(id, reqId, mode){
  const title = document.getElementById('prTitle').value.trim();
  const lines = readLines();
  if(!title){ toast('Enter a description.','error'); return; }
  if(!lines.length){ toast('Add at least one item with a quantity and a rate.','error'); return; }
  const f = {
    title, department: document.getElementById('prDept').value, category: document.getElementById('prCat').value,
    budgetCode: document.getElementById('prCode').value.trim(), reference: document.getElementById('prRef').value.trim(),
    neededBy: document.getElementById('prNeed').value || null, lines
  };
  let x = id ? recById(id) : null;
  const status = mode==='submit' ? 'Submitted' : 'Draft';
  if(x){
    Object.assign(x, f); const was = x.status; x.status = status; x.returnReason = '';
    x.hist.push({date:isoDate(TODAY), actor:STATE.role, text: was==='Returned' ? 'PR corrected and resubmitted' : (status==='Submitted' ? 'PR submitted to Procurement' : 'PR draft updated')});
  } else {
    x = mkRec('PR', nextPrNumber(), title, f.department, f.category, isoDate(TODAY), reqId||null, null,
      Object.assign({status, hist:[{date:isoDate(TODAY), actor:STATE.role, text: status==='Submitted' ? 'PR submitted to Procurement' : 'PR saved as a draft'}]}, f));
  }
  addAudit(STATE.role, (mode==='submit' ? 'Submitted PR ' : 'Saved PR draft ')+x.number+' — '+x.title, x.number);
  if(mode==='submit') notify('Procurement','PR','PR '+x.number+' ('+x.title+') is waiting for a purchase order.');
  closeModal();
  if(reqId){ doAdvance(reqId, 'PR '+x.number+' raised in the PR Portal and submitted to Procurement.', {prNumber:x.number}); return; }
  go('prDetail', x.id); toast(mode==='submit' ? x.number+' submitted to Procurement' : x.number+' saved as a draft');
}
function submitPrFromDetail(id){
  const x = recById(id); x.status = 'Submitted';
  x.hist.push({date:isoDate(TODAY), actor:STATE.role, text:'PR submitted to Procurement'});
  addAudit(STATE.role, 'Submitted PR '+x.number+' — '+x.title, x.number);

function issuePo(prId0, reqId){
  const prSel = document.getElementById('poPr').value || prId0 || '';
  const title = document.getElementById('poTitle').value.trim();
  const vendor = document.getElementById('poVendor').value;
  const lines = readLines();
  const mode = (document.querySelector('input[name=cmode]:checked')||{}).value;
  const cid = document.getElementById('cexist').value;
  if(!title){ toast('Enter a description.','error'); return; }
  if(!vendor){ toast('Select a vendor.','error'); return; }
  if(!lines.length){ toast('Add at least one item with a quantity and a rate.','error'); return; }
  if(!mode){ toast('Choose whether this PO has a contract.','error'); return; }
  if(mode==='existing' && !cid){ toast('Select the contract to attach.','error'); return; }
  const number = nextPoNumber(), pr = prSel ? recById(prSel) : null;
  const x = mkRec('PO', number, title, document.getElementById('poDept').value, document.getElementById('poCat').value, isoDate(TODAY), reqId||null,
    mode==='existing' ? cid : null, {
    status:'Issued', prId: pr ? pr.id : null, vendorName:vendor, vendorTin:document.getElementById('poTin').value.trim(),
    reference:document.getElementById('poRef').value.trim(), budgetCode:document.getElementById('poCode').value.trim(),
    paymentTerms:document.getElementById('poPay').value.trim(), deliveryDate:document.getElementById('poDeliv').value || null,
    shippingTerms:document.getElementById('poShip').value.trim(), lines, discount:num(document.getElementById('poDisc').value),
    terms:document.getElementById('poTerms').value, hist:[{date:isoDate(TODAY), actor:STATE.role, text:'PO issued'}]
  });
  if(mode==='existing'){ const c = DATA.contracts.find(y=>y.id===cid); x.hist.push({date:isoDate(TODAY), actor:STATE.role, text:'Contract '+c.contractNumber+' attached'}); }
  if(pr){ pr.status = 'PO Issued'; pr.hist.push({date:isoDate(TODAY), actor:STATE.role, text:'PO '+number+' issued'}); }
  const total = recValue(x);
  addAudit(STATE.role, 'Issued PO '+number+' — '+title+' ('+fmt$(total)+')'+(mode==='existing' ? ', attached to an existing contract' : (mode==='none' ? ', no contract' : ', contract to be drafted')), number);
  notify('Technology Department','PO','PO '+number+' was issued for "'+title+'".');
  closeModal();
  if(reqId){
    const r = DATA.requests.find(q=>q.id===reqId);
    const poDetails = {poNumber:number, value:total, lineItems:lines.map(l=>l.desc||l.item).join('; '), deliveryDate:x.deliveryDate, createdBy:STATE.role, createdDate:isoDate(TODAY)};
    if(mode==='new'){ doAdvance(reqId, 'PO '+number+' issued in the PO Portal. A contract will be drafted from it.', {poNumber:number, poDetails}); return; }
    if(mode==='none'){ doAdvance(reqId, 'PO '+number+' issued in the PO Portal. No contract is needed for this purchase — request closed.', {poNumber:number, poDetails, _close:'none'}); return; }
    const c = DATA.contracts.find(y=>y.id===cid);
    doAdvance(reqId, 'PO '+number+' issued in the PO Portal and attached to contract '+c.contractNumber+' — request closed.', {poNumber:number, poDetails, contractId:cid, _close:'existing'});
    return;
  }
  go('poDoc', x.id); toast(number+' issued'+(mode==='existing' ? ' and attached to a contract' : ''));
}

/* ---- Close a request at the PO step (no contract / existing contract) ---- */
function closeRequestAtPo(reqId, mode, cid, quiet){
  const r = DATA.requests.find(q=>q.id===reqId);
  const po = DATA.prpo.find(x=>x.type==='PO' && x.number===r.poNumber);
  r.status = 'Completed';
  if(mode==='none'){ r.noContract = true; if(!quiet) r.history.push({step:11, date:isoDate(TODAY), note:'No contract is needed for this purchase — request closed.'}); }
  else {
    const c = DATA.contracts.find(y=>y.id===cid);
    r.contractAttached = true; r.contractId = cid;
    if(po){ po.contractId = cid; po.hist.push({date:isoDate(TODAY), actor:STATE.role, text:'Contract '+c.contractNumber+' attached'}); }
    if(!quiet) r.history.push({step:11, date:isoDate(TODAY), note:'PO attached to existing contract '+c.contractNumber+' — request closed.'});
  }
  addAudit(STATE.role, 'Closed request "'+r.title+'" at the PO step ('+(mode==='none'?'no contract':'existing contract attached')+')', r.id);
}
function closeNoContract(reqId){ closeRequestAtPo(reqId, 'none'); go('requestDetail', reqId); toast('Request closed — no contract needed'); }
function openAttachToRequest(reqId){
  const contracts = [...DATA.contracts].sort((a,b)=>a.contractNumber.localeCompare(b.contractNumber));
  showModal(`<span class="close" onclick="closeModal()">✕</span><h3>Attach an existing contract</h3>
    <label class="f">Contract</label><select id="rqContract" class="fld"><option value="">Select…</option>${contracts.map(c=>`<option value="${c.id}">${c.contractNumber} — ${c.vendorName} (${c.status})</option>`).join('')}</select>
    <div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveAttachToRequest('${reqId}')">Attach &amp; close request</button></div>`);
}
function saveAttachToRequest(reqId){
  const cid = document.getElementById('rqContract').value;
  if(!cid){ toast('Select a contract.','error'); return; }

}
function sumV(arr){ return arr.reduce((a,x)=>a+recValue(x),0); }
function pct(a,b){ return b ? Math.round(a/b*100) : 0; }
function niceScale(v, isInt){
  if(v<=0) v = 1;
  const raw = v/4, p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw/p;
  let step = (n<=1?1 : n<=2?2 : n<=2.5?2.5 : n<=5?5 : 10) * p;
  if(isInt){ step = Math.max(1, step===2.5*p ? 5*p : step); if(step<1) step = 1; }
  const cnt = Math.max(1, Math.ceil(v/step - 1e-9));
  return {mx: cnt*step, n: cnt, step};
}
function niceMax(v){ return niceScale(v,false).mx; }
function axisFmt(v){ return v>=1e6 ? '$'+(v/1e6)+'M' : (v>=1e3 ? '$'+(v/1e3)+'K' : '$'+v); }
function legendHtml(items){ return `<div class="vlegend">${items.map(i=>`<span class="lgi"><i style="background:${i.color}"></i>${esc(i.name)}${i.extra?` <em>${esc(i.extra)}</em>`:''}</span>`).join('')}</div>`; }
function topRound(x, y, w, h, r){ r = Math.min(r, h, w/2); return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`; }
function rightRound(x, y, w, h, r){ r = Math.min(r, w, h/2); return `M${x},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h-r}Q${x+w},${y+h} ${x+w-r},${y+h}H${x}Z`; }
function tipAttr(head, rows){ return esc([head].concat(rows.map(r=>r.join('::'))).join('|')); }

/* stacked / single-series columns */
function colChart(o){
  const W = 760, H = o.height || 250, L = 50, R = 12, T = 22, B = 38;
  const n = o.labels.length, iw = W-L-R, ih = H-T-B, slot = iw/n, bw = Math.min(24, slot*0.55);
  const totals = o.labels.map((_,i)=>o.series.reduce((a,s)=>a+(s.vals[i]||0),0));
  const sc = niceScale(Math.max.apply(null, totals.concat([1])), !!o.int), mx = sc.mx;
  const y = v => T + ih - v/mx*ih;
  let g = '';
  for(let i=0;i<=sc.n;i++){ const v = sc.step*i, yy = y(v);
    g += `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="${C_GRID}" stroke-width="1"/><text x="${L-8}" y="${yy+4}" text-anchor="end" class="vax">${o.fmtAxis? o.fmtAxis(v) : axisFmt(v)}</text>`; }
  const hi = totals.indexOf(Math.max.apply(null,totals));
  o.labels.forEach((lab,i)=>{
    const cx = L + slot*i + slot/2, x0 = cx - bw/2; let acc = 0, lastIdx = -1;
    o.series.forEach((s,k)=>{ if((s.vals[i]||0)>0) lastIdx = k; });
    o.series.forEach((s,k)=>{
      const v = s.vals[i]||0; if(v<=0) return;
      const hh = Math.max(2, v/mx*ih), yTop = y(acc+v), h2 = (acc>0 ? hh-2 : hh);
      const top = k===lastIdx;
      g += top ? `<path d="${topRound(x0, yTop, bw, h2, 4)}" fill="${s.color}"/>` : `<rect x="${x0}" y="${yTop}" width="${bw}" height="${h2}" fill="${s.color}"/>`;
      acc += v;
    });
    if(totals[i]>0 && (i===hi || i===n-1)) g += `<text x="${cx}" y="${y(totals[i])-6}" text-anchor="middle" class="vval">${o.fmtVal? o.fmtVal(totals[i]) : fmtK(totals[i])}</text>`;
    const rows = o.series.filter(s=>(s.vals[i]||0)>0).map(s=>[s.name, (o.fmtVal||fmtK)(s.vals[i]), s.color]);
    if(o.series.length>1) rows.push(['Total', (o.fmtVal||fmtK)(totals[i]), '']);
    if(!rows.length) rows.push([o.emptyLabel||'No data','','']);
    g += `<text x="${cx}" y="${T+ih+16}" text-anchor="middle" class="vax">${esc(lab.split('|')[0])}</text>`;
    if(lab.split('|')[1]) g += `<text x="${cx}" y="${T+ih+29}" text-anchor="middle" class="vax2">${esc(lab.split('|')[1])}</text>`;
    g += `<rect class="vhit" x="${L+slot*i}" y="${T}" width="${slot}" height="${ih}" fill="transparent" tabindex="0" data-tip="${tipAttr(lab.split('|')[0]+(lab.split('|')[1]?' '+lab.split('|')[1]:''), rows)}"/>`;
  });
  g += `<line x1="${L}" x2="${W-R}" y1="${T+ih}" y2="${T+ih}" stroke="#c9ced4" stroke-width="1"/>`;
  return `<svg class="vsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'')}">${g}</svg>`;
}

/* horizontal bars: stacked segments (default) or grouped bars */
function barsH(o){
  const W = 760, LW = o.labelW || 190, R = 78, bt = o.thick || 16, gp = 2;
  const n = o.rows.length, per = o.grouped ? (o.rows[0] ? o.rows[0].segs.length : 1) : 1;
  const rowH = o.grouped ? per*(bt-2)+per*gp+16 : bt+16, T = 6, B = 28, H = T + n*rowH + B;
  const tot = r => o.grouped ? Math.max.apply(null, r.segs.map(s=>s.val).concat([0])) : r.segs.reduce((a,s)=>a+s.val,0);
  const sc = niceScale(Math.max.apply(null, o.rows.map(tot).concat([1])), !!o.int), mx = sc.mx, iw = W-LW-R;
  const x = v => LW + v/mx*iw;
  let g = '';
  for(let i=0;i<=sc.n;i++){ const v = sc.step*i, xx = x(v);
    g += `<line y1="${T}" y2="${H-B}" x1="${xx}" x2="${xx}" stroke="${C_GRID}" stroke-width="1"/><text x="${xx}" y="${H-10}" text-anchor="middle" class="vax">${o.fmtAxis? o.fmtAxis(v) : axisFmt(v)}</text>`; }
  o.rows.forEach((r,i)=>{
    const y0 = T + i*rowH + 8; const fv = o.fmtVal || fmtK;
    g += `<text x="${LW-10}" y="${y0 + (o.grouped ? (per*(bt-2))/2 : bt/2) + 4}" text-anchor="end" class="vlab">${esc(r.label.length>26? r.label.slice(0,25)+'…' : r.label)}</text>`;
    if(r.sub) g += `<text x="${LW-10}" y="${y0 + (o.grouped ? (per*(bt-2))/2 : bt/2) + 17}" text-anchor="end" class="vax2">${esc(r.sub)}</text>`;
    if(o.grouped){
      r.segs.forEach((s,k)=>{ const yy = y0 + k*(bt-2+gp), w = Math.max(0, x(s.val)-LW);
        if(w>0) g += `<path d="${rightRound(LW, yy, w, bt-2, 4)}" fill="${s.color}"/>`;
        g += `<text x="${LW+w+6}" y="${yy+(bt-2)/2+4}" class="vval2">${fv(s.val)}</text>`; });
    } else {
      let acc = 0; const last = r.segs.map(s=>s.val>0).lastIndexOf(true);
      r.segs.forEach((s,k)=>{ if(s.val<=0) return; const x1 = x(acc), w = x(acc+s.val)-x1 - (acc>0?2:0), xs = x1 + (acc>0?2:0);
        g += k===last ? `<path d="${rightRound(xs, y0, Math.max(w,2), bt, 4)}" fill="${s.color}"/>` : `<rect x="${xs}" y="${y0}" width="${Math.max(w,2)}" height="${bt}" fill="${s.color}"/>`; acc += s.val; });
      g += `<text x="${x(acc)+6}" y="${y0+bt/2+4}" class="vval2">${fv(acc)}</text>`;
    }
    const rows = r.segs.map(s=>[s.name, fv(s.val), s.color]);
    if(!o.grouped && r.segs.length>1) rows.push(['Total', fv(tot(r)), '']);
    g += `<rect class="vhit" x="0" y="${T+i*rowH}" width="${W}" height="${rowH}" fill="transparent" tabindex="0" data-tip="${tipAttr(r.label, rows)}"/>`;
  });
  return `<svg class="vsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'')}">${g}</svg>`;
}
