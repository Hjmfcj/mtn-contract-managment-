function exportReport(){
  const tab = STATE.rpTab || 'overview', {prs, pos, cons} = rpScope();
  let rows = [], name = 'report';
  if(tab==='overview'){ name='pr_po_overview'; rows = [['Type','Number','Description','Business unit','Category','Value','Date','Status','Contract']];
    prs.concat(pos).forEach(x=>{ const c = x.contractId ? DATA.contracts.find(y=>y.id===x.contractId) : null; rows.push([x.type,x.number,x.title,x.department,x.category,recValue(x),x.date,x.status,c?c.contractNumber:'']); }); }
  if(tab==='contract'){ name='prs_pos_per_contract'; rows = [['Contract','Vendor','Term','Category','PRs','POs','Contract value','Attached PO value','Status']];
    cons.forEach(c=>rows.push([c.contractNumber,c.vendorName,c.termType||'',c.contractType,recsOf(c.id,'PR').length,recsOf(c.id,'PO').length,c.contractValue,sumV(recsOf(c.id,'PO')),c.status])); }
  if(tab==='nocon'){ name='pos_without_contract'; rows = [['PO','Description','Vendor','Business unit','Category','Value','Date']];
    pos.filter(x=>!x.contractId).forEach(x=>rows.push([x.number,x.title,x.vendorName,x.department,x.category,recValue(x),x.date])); }
  if(tab==='cycle'){ name='pr_cycle'; rows = [['PR','Description','Business unit','Status','Raised','Days since raised','PO']];
    prs.forEach(x=>rows.push([x.number,x.title,x.department,x.status,x.date,daysBetween(x.date,TODAY),poOfPr(x.id).map(p=>p.number).join(' ')])); }
  if(tab==='vendor'){ name='po_by_vendor'; rows = [['Vendor','POs','PO value']];
    [...new Set(pos.map(x=>x.vendorName))].forEach(v=>{ const p = pos.filter(x=>x.vendorName===v); rows.push([v,p.length,sumV(p)]); }); }
  if(tab==='savings'){ name='savings'; rows = [['PO','PR','Vendor','Business unit','Category','PO date','PR estimate','PO value','Discount','Price difference','Net saving against estimate']];
    pos.forEach(po=>{ const r = savingsOf(po); rows.push([po.number, r.pr?r.pr.number:'', po.vendorName, po.department, po.category, po.date, r.est==null?'':r.est, r.total, r.disc, r.price==null?'':r.price, r.net==null?'':r.net]); }); }
  if(tab==='monitor'){ name='po_monitoring'; rows = [['PO','Description','Vendor','Business unit','Category','Value','Contract','Watching','Watch date','Days','Delivery date','Delivered on']];
    pos.forEach(po=>{ const i = watchInfo(po), c = po.contractId ? DATA.contracts.find(y=>y.id===po.contractId) : null;
      rows.push([po.number,po.title,po.vendorName,po.department,po.category,recValue(po),c?c.contractNumber:'', i.w?i.w.label:'', i.w?i.w.date:'', i.days==null?'':i.days, po.deliveryDate||'', po.deliveredOn||'']); }); }
  downloadCsv(rows, 'mtn_cm_'+name+'.csv');
}
function downloadCsv(rows, fname){
  const csv = rows.map(row=>row.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download = fname; a.click();
}

/* ---- chart tooltip (one element, text only) ---- */
(function(){
  let tip = null;
  function ensure(){ if(!tip){ tip = document.createElement('div'); tip.id = 'vizTip'; document.body.appendChild(tip); } return tip; }
  function show(el, x, y){
    const t = ensure(), parts = (el.getAttribute('data-tip')||'').split('|');
    t.textContent = '';
    const h = document.createElement('div'); h.className = 'th'; h.textContent = parts[0]; t.appendChild(h);
    parts.slice(1).forEach(p=>{
      const a = p.split('::'), row = document.createElement('div'); row.className = 'tr';
      if(a[2]){ const k = document.createElement('i'); k.style.background = a[2]; row.appendChild(k); }
      const v = document.createElement('b'); v.textContent = a[1] || ''; row.appendChild(v);
      const n = document.createElement('span'); n.textContent = a[0]; row.appendChild(n); t.appendChild(row);
    });
    t.style.display = 'block';
    const w = t.offsetWidth, hh = t.offsetHeight;
    t.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, x + 14)) + 'px';
    t.style.top = Math.min(window.innerHeight - hh - 8, Math.max(8, y + 14)) + 'px';
  }
  function hide(){ if(tip) tip.style.display = 'none'; }
  document.addEventListener('pointermove', e=>{ const el = e.target.closest && e.target.closest('[data-tip]'); if(el) show(el, e.clientX, e.clientY); else hide(); });
  document.addEventListener('focusin', e=>{ const el = e.target.closest && e.target.closest('[data-tip]'); if(el){ const r = el.getBoundingClientRect(); show(el, r.left + Math.min(r.width/2, 120), r.top + r.height/2); } });
  document.addEventListener('focusout', hide);
  document.addEventListener('pointerleave', hide);
})();

function splitRow(label, arr){
  const cxa = arr.filter(x=>x.category==='CAPEX'), oxa = arr.filter(x=>x.category!=='CAPEX'), n = arr.length;
  const cv = sumV(cxa), ov = sumV(oxa);
  return `<div class="splitrow"><div><b>${label}</b> <span class="note">· ${n}</span></div>
    <div class="splitbar" title="CAPEX ${cxa.length} · OPEX ${oxa.length}"><div class="sc" style="width:${n? cxa.length/n*100 : 0}%"></div><div class="so" style="width:${n? oxa.length/n*100 : 0}%"></div></div>
    <div class="lg"><span class="lgdot" style="background:${C_CAPEX}"></span>CAPEX ${cxa.length} · ${fmtK(cv)}<br><span class="lgdot" style="background:${C_OPEX}"></span>OPEX ${oxa.length} · ${fmtK(ov)}</div></div>`;
}
function segBar(label, segs, onclick){
  const n = segs.reduce((a,s)=>a+s.n,0);

    <div class="splitbar">${segs.filter(s=>s.n>0).map(s=>`<div style="width:${n? s.n/n*100 : 0}%;background:${s.color}" title="${s.name} ${s.n}"></div>`).join('')}</div>
    <div class="lg">${segs.map(s=>`<span class="lgdot" style="background:${s.color}"></span>${s.name} ${s.n}`).join('<br>')}</div></div>`;
}

function cval(c){ return c.contractValue ? fmt$(c.contractValue)+' '+(c.currency||'USD') : 'Not stated'; }

/* ---- what is being watched for a purchase order ----
   with a contract that has an end date  -> the contract end date
   otherwise                              -> the delivery date of the PO */
function watchOf(po){
  const c = po.contractId ? DATA.contracts.find(y=>y.id===po.contractId) : null;
  if(c && c.endDate) return {date:c.endDate, basis:'contract', label:'Contract end', c};
  if(po.deliveryDate) return {date:po.deliveryDate, basis:'delivery', label:'Delivery date', c};
  return null;
}
function watchInfo(po){
  const w = watchOf(po);
  if(!w) return {key:'none', w:null, days:null};
  if(w.basis==='delivery' && po.deliveredOn) return {key:'delivered', w, days:null};
  const d = daysBetween(TODAY, w.date);
  return {key:bandOf(d).key, w, days:d};
}
function watchText(i){
  if(i.key==='delivered') return 'Delivered';
  if(i.key==='none') return 'No date';
  const d = i.days;
  if(i.w.basis==='contract') return timeLeftText(d);
  if(d<0) return 'Overdue '+(-d)+(d===-1?' day':' days');
  if(d===0) return 'Due today';
  return 'Due in '+d+(d===1?' day':' days');
}
function watchPill(po){
  const i = watchInfo(po);
  if(i.key==='delivered') return '<span class="pill green">Delivered</span>';
  if(i.key==='none') return '<span class="pill grey">No date</span>';
  return `<span class="pill ${BAND_PILL[i.key]}">${watchText(i)}</span>`;
}
function isActiveWatch(i){ return i.key!=='delivered' && i.key!=='none'; }
function bandLabel(b){
  const w = scheduleDays();
  return b.key==='expired' ? 'Past due' : (b.key==='ok' ? 'Beyond '+w[3]+' days' : b.label);
}
function deliveryState(po){
  if(!po.deliveryDate) return null;
  if(po.deliveredOn) return po.deliveredOn <= po.deliveryDate ? 'ontime' : 'late';
  return new Date(po.deliveryDate) < TODAY ? 'overdue' : 'open';
}
function deliveryText(po){
  const st = deliveryState(po);
  if(po.deliveredOn){
    const late = daysBetween(po.deliveryDate, po.deliveredOn);
    return 'Delivered '+fmtDate(po.deliveredOn)+(late>0 ? '<br><span class="note">'+late+(late===1?' day':' days')+' late</span>' : '');
  }
  return po.deliveryDate ? 'Due '+fmtDate(po.deliveryDate) : '<span class="note">—</span>';
}

  <div class="card" style="margin-top:16px">
    <div class="toolbar">
      ${tb('active','Being watched')} ${tb('past','Past due')} ${tb('soon','Due within 30 days')} ${tb('con','Watched by contract end')} ${tb('nocon','Watched by delivery date')} ${tb('delivered','Delivered')} ${tb('all','All POs')}
      <span style="margin-left:auto"></span>
      ${fsel('moCat','Category',BUDGET_CATS)} ${fsel('moDept','Business unit',depts)} ${fsel('moVen','Vendor',vendors)}
    </div>
    ${!list.length ? '<div class="empty">No purchase order matches this filter.</div>' : `<table><thead><tr><th>PO</th><th>Description</th><th>Vendor</th><th style="text-align:right">Value</th><th>Contract</th><th>Watching</th><th>Status</th><th>Delivery</th>${canAct?'<th class="noprint"></th>':''}</tr></thead><tbody>
    ${list.map(({po,i})=>`<tr class="rowlink" onclick="go('poDoc','${po.id}')">
      <td style="white-space:nowrap"><b>${po.number}</b></td><td>${esc(po.title)}<br><span class="note">${po.department}</span> ${catPill(po.category)}</td><td>${esc(po.vendorName)}</td>

function saveDelivered(id){
  const x = recById(id), d = document.getElementById('dlDate').value;
  if(!d){ toast('Enter the delivery date.','error'); return; }
  x.deliveredOn = d; x.deliveryNote = document.getElementById('dlNote').value.trim();
  x.hist.push({date:d, actor:STATE.role, text:'Marked as delivered'+(x.deliveryNote?' · delivery note '+x.deliveryNote:'')});
  addAudit(STATE.role, 'Marked PO '+x.number+' as delivered', x.number);
  closeModal(); renderAll(); toast(x.number+' marked as delivered');
}
function undoDelivered(id){
  const x = recById(id); x.deliveredOn = null; x.deliveryNote = '';
  x.hist.push({date:isoDate(TODAY), actor:STATE.role, text:'Delivery record removed'});
  const sent = x.watchSent || []; x.watchSent = sent.filter(a=>a.window==='never');
  addAudit(STATE.role, 'Removed the delivery record of PO '+x.number, x.number);
  renderAll(); toast('Delivery record removed');
}

/* ---- notifications for watched dates (one set per purchase order) ---- */
function checkPoWatch(opts){
  opts = opts || {};
  let fired = 0;
  const sched = [...EXPIRY_SCHEDULE].sort((a,b)=>b.days-a.days);
  DATA.prpo.filter(x=>x.type==='PO').forEach(po=>{
    const key = po.contractId || '';
    if(po._wc !== key){ po._wc = key; po.watchSent = []; }
    const w = watchOf(po); if(!w) return;
    if(w.basis==='delivery' && po.deliveredOn) return;
    const days = daysBetween(TODAY, w.date);
    const what = w.basis==='contract' ? 'contract '+w.c.contractNumber+' ends' : 'delivery is due';
    const reached = sched.filter(s=>days<=s.days);
    const tightest = reached.length ? reached[reached.length-1] : null;
    reached.filter(s=>!po.watchSent.some(a=>a.window===s.days)).forEach(s=>{
      const when = opts.backfill ? addDays(w.date, -s.days) : new Date(TODAY);
      const n = opts.backfill ? s.days : days;
      const sev = bandOf(n).key;
      const unread = !opts.backfill || (days>=0 && tightest && tightest.days===s.days);
      notify('Procurement','Expiry','PO '+po.number+' ('+po.title+'): '+what+' on '+fmtDate(w.date)+' — '+(n<0 ? 'past due' : n+' days left')+'.',
        {pid:po.id, sev, title:s.days+'-day notice', ts:when, read:!unread});
      po.watchSent.push({window:s.days, date:isoDate(when)});
      fired++;
    });
    if(days<0 && !po.watchSent.some(a=>a.window==='past')){
      const when = opts.backfill ? addDays(w.date, 1) : new Date(TODAY);
      notify('Procurement','Expiry','PO '+po.number+' ('+po.title+'): '+(w.basis==='contract' ? 'contract '+w.c.contractNumber+' ended on ' : 'delivery date passed on ')+fmtDate(w.date)+'.',
        {pid:po.id, sev:'expired', title:w.basis==='contract' ? 'Contract ended' : 'Delivery overdue', ts:when, read:false});
      po.watchSent.push({window:'past', date:isoDate(when)});
      fired++;
    }
  });
  if(fired) DATA.notifications.sort((a,b)=>new Date(b.ts)-new Date(a.ts));
  return fired;
}

/* ---- savings ---- */
function savingsOf(po){
  const pr = po.prId ? recById(po.prId) : null, t = docTotals(po);
  if(!pr) return {pr:null, est:null, total:t.total, disc:t.disc, net:null, price:null};
  const est = recValue(pr), net = est - t.total;
  return {pr, est, total:t.total, disc:t.disc, net, price:net - t.disc};
}
function savingsSummary(pos){
  const rows = pos.map(po=>Object.assign({po}, savingsOf(po)));
  const withEst = rows.filter(r=>r.est!=null);
  const est = withEst.reduce((a,r)=>a+r.est,0), net = withEst.reduce((a,r)=>a+r.net,0);
  return {rows, withEst, est, net, rate:pct(net, est), disc:rows.reduce((a,r)=>a+r.disc,0), discN:rows.filter(r=>r.disc>0).length,
    above:withEst.filter(r=>r.net<0), below:withEst.filter(r=>r.net>0)};
}
function renderSavingsCard(){
  const s = savingsSummary(DATA.prpo.filter(x=>x.type==='PO'));
  return `<div class="card">

/* ---- ACTION ITEMS — role-scoped "what needs you right now" (per Shehab's standing UX rule) ---- */
function computeActionItems(role){
  const items = [];
  (LEAN ? [] : DATA.requests).forEach(r=>{
    const nextStep = STEPS.find(s=>s.n===r.currentStep+1);
    if(nextStep && nextStep.owner===role && r.status!=='Completed'){
      items.push({label:r.title, sub:'Step '+nextStep.n+' — '+nextStep.name, urgent:nextStep.n<=3,
        onclick:`go('requestDetail','${r.id}')`});
    }
  });
  if(role==='Executive Management' || role==='Vendor (External)'){
    DATA.contracts.filter(c=>c.status==='Approved for Signature').forEach(c=>{
      const party = role==='Vendor (External)' ? 'Vendor' : 'MTN (Authorized Signatory)';
      if(!c.signatures.some(s=>s.party===party)){
        items.push({label:'Sign contract '+c.contractNumber, sub:c.vendorName+' · '+fmt$(c.contractValue), urgent:true,
          onclick:`go('contractDetail','${c.id}')`});
      }
    });
  }
  if(!PHASE1 && !LEAN && ['Vendor Management','Finance / Budget Owner','Legal','Technology Department'].includes(role)){
    DATA.forms.filter(f=>f.status!=='Signed' && !f.signatures.some(s=>s.role===role)).forEach(f=>{
      items.push({label:'Sign '+f.type+' '+f.id, sub:'Reference: '+f.ref, urgent:false, onclick:`go('formDetail','${f.id}')`});
    });
  }
  if(!PHASE1 && role==='Finance / Budget Owner'){
    DATA.payments.filter(p=>p.stage!=='Completed').forEach(p=>{
      items.push({label:'Advance payment '+p.id, sub:p.contractNumber+' · '+fmt$(p.amount)+' · currently '+p.stage, urgent:false, onclick:`go('payments')`});
    });
  }
  if(['Vendor Management','Legal'].includes(role)){
    DATA.contracts.filter(c=>expirable(c) && daysLeft(c)<=scheduleDays()[1] && !c.expiryDecision).sort((a,b)=>daysLeft(a)-daysLeft(b)).forEach(c=>{
      const d = daysLeft(c);
      items.push({label:(d<0?'Contract expired: ':'Contract expiring: ')+c.contractNumber, sub:c.vendorName+' · '+timeLeftText(d)+' · decision needed', urgent:d<=scheduleDays()[0], onclick:`go('contractDetail','${c.id}')`});
    });
  }
  if(!PHASE1 && role==='Strategy'){
    DATA.requests.filter(r=>r.strategicFlag && !r.strategicFlag.resolved).forEach(r=>{
      items.push({label:'Flagged for strategic review: '+r.title, sub:r.strategicFlag.note, urgent:false, onclick:`go('requestDetail','${r.id}')`});
    });
  }
  if(!PHASE1 && role==='Technology Department'){
    DATA.prpo.filter(x=>x.type==='PR' && (x.status==='Returned' || x.status==='Draft')).forEach(x=>{
      items.push({label:(x.status==='Returned'?'PR returned: ':'PR draft: ')+x.number, sub:x.title+(x.returnReason?' · '+x.returnReason:''), urgent:x.status==='Returned', onclick:`go('prDetail','${x.id}')`});
    });
  }
  if(!PHASE1 && role==='Procurement'){
    const wq = DATA.prpo.filter(x=>x.type==='PR' && x.status==='Submitted' && (LEAN || !x.requestId));
    if(LEAN){ if(wq.length) items.push({label:wq.length+(wq.length===1?' PR is':' PRs are')+' waiting for a PO', sub:fmt$(sumV(wq))+' estimated · oldest raised '+fmtDate(wq.map(x=>x.date).sort()[0]), urgent:false, onclick:`go('poportal','queue')`}); }
    else wq.forEach(x=>{
      items.push({label:'PR waiting for a PO: '+x.number, sub:x.title+' · '+x.department+' · '+fmt$(recValue(x)), urgent:false, onclick:`go('prDetail','${x.id}')`});
    });
  }
  if(LEAN && role==='Procurement'){
    activeWatch().filter(o=>o.i.days<=scheduleDays()[0]).sort((a,b)=>a.i.days-b.i.days).forEach(o=>{
      items.push({label:(o.i.days<0 ? 'Past due: ' : 'Due soon: ')+o.po.number, sub:esc(o.po.title)+' · '+o.i.w.label+' '+fmtDate(o.i.w.date)+' · '+watchText(o.i), urgent:o.i.days<0, onclick:`go('poDoc','${o.po.id}')`});
    });
  }
  return items;
}
function renderActionItems(role){
  const items = computeActionItems(role);
  if(!items.length){
    return `<div class="banner green">✓ You're all caught up, ${role} — nothing needs your action right now.</div>`;
  }
  return `
  <div class="card" style="border-color:#c77a1c;background:linear-gradient(180deg,#fdf1e0 0%,#fff 60px)">
    <div class="flex-between"><h3 style="margin:0;color:#c77a1c">🟠 Needs Your Action — ${items.length}</h3></div>
    ${items.map(it=>`<div class="rowlink" onclick="${it.onclick}" style="padding:9px 4px;border-bottom:1px solid #f0e2c8;cursor:pointer">
      <b>${it.label}</b> ${it.urgent?'<span class="pill red">Priority</span>':''}<br><span class="note">${it.sub}</span>
    </div>`).join('')}
  </div>`;
}


function dashScope(){
  const f = STATE.filters;
  const cons = DATA.contracts.filter(c=>(!f.dCat||c.contractType===f.dCat) && (!f.dTerm||c.termType===f.dTerm) && (!f.dDept||c.department===f.dDept));
  const ids = new Set(cons.map(c=>c.id));
  const recs = DATA.prpo.filter(x=>(!f.dCat||x.category===f.dCat) && (!f.dDept||x.department===f.dDept) && (x.contractId? ids.has(x.contractId) : !f.dTerm));

function exportCsv(){

function doAdvance(reqId, note, patch){
  const r = DATA.requests.find(x=>x.id===reqId);
  const nextN = r.currentStep+1;
  const st = STEPS.find(s=>s.n===nextN);
  r.currentStep = nextN;
  r.history.push({step:nextN, date: isoDate(TODAY), note});
  const closeMode = patch && patch._close;
  if(patch){ const pp = Object.assign({}, patch); delete pp._close; Object.assign(r, pp); }
  if(nextN===2) r.status='Under Review';
  if(nextN===3) r.status='Under Review';
  if(nextN===4) { r.status='Approved'; r.approvedBudget = r.requestedBudget; }
  if(nextN>=5 && nextN<=11) r.status='Tendering';
  if(nextN>=12) r.status='Contracting';
  if(closeMode) closeRequestAtPo(reqId, closeMode, r.contractId, true);
  addAudit(STATE.role, 'Advanced "'+r.title+'" to step '+nextN+' ('+st.name+')', r.id);
  const next2 = STEPS.find(s=>s.n===nextN+1);
  if(next2 && !closeMode) notify(next2.owner, 'Workflow', '"'+r.title+'" is ready for your action: '+next2.name+'.');
  go('requestDetail', reqId);
}

  const val = document.getElementById('srcStrategy').value;

  if(!ids.length){ alert('Select at least one vendor to invite.'); return; }

function filteredContracts(){
  const g = id=>STATE.filters[id]||'';
  return DATA.contracts.filter(c=>
    (!g('ccVendor')||c.vendorName===g('ccVendor')) &&
    (!g('ccDept')||c.department===g('ccDept')) &&
    (!g('ccType')||c.contractType===g('ccType')) &&
    (!g('ccStatus')||c.status===g('ccStatus')) &&
    (!g('ccDomain')||c.technologyDomain===g('ccDomain')) &&
    (!g('ccTerm')||c.termType===g('ccTerm')) &&

function exportContractsCsv(){

  const csv = rows.map(row=>row.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');

function signContract(cid){
  const name = document.getElementById('sigName').value.trim();
  if(!name){ alert('Type your legal name to sign.'); return; }
  const c = DATA.contracts.find(x=>x.id===cid);
  const party = STATE.role==='Vendor (External)' ? 'Vendor' : 'MTN (Authorized Signatory)';
  c.signatures.push({party, name, date: isoDate(TODAY)});
  addAudit(STATE.role, 'E-signed contract', c.contractNumber);
  const requiredParties = ['MTN (Authorized Signatory)','Vendor'];
  const fullySigned = requiredParties.every(p=> c.signatures.some(s=>s.party===p));
  if(fullySigned){
    c.status = 'Active';
    const rq = DATA.requests.find(x=>x.id===c.requestId);
    if(rq && rq.currentStep<14){ rq.currentStep = 14; rq.status = 'Completed'; rq.history.push({step:14, date:isoDate(TODAY), note:'Contract '+c.contractNumber+' signed by both parties and executed.'}); }
    ['Vendor Management','Finance / Budget Owner','Procurement','Technology Department','Legal','Executive Management'].forEach(role=>{
      notify(role, 'Execution', 'Contract '+c.contractNumber+' with '+c.vendorName+' is fully signed and now Active/Executed.');
    });
    notify('Vendor (External)','Execution','Your contract '+c.contractNumber+' with MTN is now fully executed.');
    const months = c.endDate ? Math.max(1, Math.round(daysBetween(c.startDate,c.endDate)/30)) : 1;
    const per = Math.round(c.contractValue/months);
    for(let i=0;i<Math.min(months,6);i++){
      const d = new Date(c.startDate); d.setMonth(d.getMonth()+i+1);
      DATA.forecasts.push({id:uid('FC'), contractId:c.id, contractNumber:c.contractNumber, vendor:c.vendorName,
        department:c.department, projectName:c.projectName||'—', currency:c.currency||'USD',
        month:d.toISOString().slice(0,7), dueDate:isoDate(d), amount:per, paid:false, reminderSent:false});
    }
    DATA.payments.push({id:uid('PM'), contractId:c.id, contractNumber:c.contractNumber, vendor:c.vendorName, amount:per, stage:'Submitted', date: isoDate(TODAY)});
    addAudit('System', PHASE1 ? 'Contract executed — expiry monitoring registered' : 'Contract executed — payment forecast generated and expiry monitoring registered', c.contractNumber);
    if(ARCHIVE_INTEGRATION){
      c.archiveRef = archiveRef();
      addAudit('System','Executed contract archived to the document repository (Ref: '+c.archiveRef+')', c.contractNumber);
    }
  }
  go('contractDetail', cid);
}

function forecastStatus(f){
  if(f.paid) return 'Paid';
  const days = daysBetween(TODAY, f.dueDate);
  if(days<0) return 'Overdue';
  if(days<=7) return 'Due in 7 days';
  if(days<=15) return 'Due in 15 days';
  if(days<=30) return 'Due in 30 days';
  return 'Planned';
}
function forecastPill(status){
  const map = {Paid:'green', Overdue:'red', 'Due in 7 days':'red', 'Due in 15 days':'amber', 'Due in 30 days':'amber', Planned:'grey'};
  return `<span class="pill ${map[status]||'grey'}">${status}</span>`;
}
function filteredForecasts(){
  const g = id=>{ const el=document.getElementById(id); return el?el.value:''; };
  return DATA.forecasts.filter(f=>
    (!g('cfMonth')||f.month===g('cfMonth')) &&
    (!g('cfVendor')||f.vendor===g('cfVendor')) &&
    (!g('cfDept')||f.department===g('cfDept'))
  );
}

function sendPaymentReminder(fid){
  const f = DATA.forecasts.find(x=>x.id===fid);

function exportForecastsCsv(){
  const list = filteredForecasts();
  const rows = [['Month','Contract','Vendor','Department','Project','Amount','Currency','Due Date','Status']];
  list.forEach(f=>rows.push([f.month,f.contractNumber,f.vendor,f.department,f.projectName,f.amount,f.currency,f.dueDate,forecastStatus(f)]));
  const csv = rows.map(row=>row.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');

}

  const r = DATA.requests.find(x=>x.id===reqId);
  const val = document.getElementById('pdDate').value;
  if(!val){ alert('Pick a date.'); return; }
  r.proposalDueDate = val;
  addAudit(STATE.role, 'Set proposal due date for "'+r.title+'"', fmtDate(val));
  closeModal();
  renderAll();
}
function scoreVendor(reqId, vendorId){
  const r = DATA.requests.find(x=>x.id===reqId);
  const existing = r.vendorScores[vendorId] || {};
  showModal(`
    <h3>Score Vendor <span class="close" onclick="closeModal()">✕</span></h3>
    <div class="note">${r.title} — ${vendorName(vendorId)}</div>
    <label class="f">Technical Score (0-100)</label><input type="number" min="0" max="100" id="scTech" value="${existing.technical!=null?existing.technical:''}">
    <label class="f">Commercial Score (0-100)</label><input type="number" min="0" max="100" id="scComm" value="${existing.commercial!=null?existing.commercial:''}">
    <div style="margin-top:14px;text-align:right"><button class="btn secondary" onclick="closeModal()">Cancel</button> <button class="btn" onclick="saveVendorScore('${r.id}','${vendorId}')">Save Scores</button></div>
  `);
}
function saveVendorScore(reqId, vendorId){
  const r = DATA.requests.find(x=>x.id===reqId);
  const t = Number(document.getElementById('scTech').value);
  const c = Number(document.getElementById('scComm').value);
  if(isNaN(t)||isNaN(c)){ alert('Enter both scores.'); return; }
  r.vendorScores[vendorId] = {technical:t, commercial:c};
  addAudit(STATE.role, 'Scored '+vendorName(vendorId)+' for "'+r.title+'" (Technical '+t+', Commercial '+c+')', r.id);
  closeModal();
  renderAll();
}

/* ---- STRATEGIC PORTFOLIO VIEW (deep dedicated engagement — confirmed primary stakeholder) ---- */
function renderStrategy(){
  const reqs = DATA.requests;
  const totalReq = reqs.length;
  const totalRequested = reqs.reduce((a,r)=>a+r.requestedBudget,0);
  const totalApproved = reqs.filter(r=>r.approvedBudget).reduce((a,r)=>a+r.approvedBudget,0);
  const activeContracts = DATA.contracts.filter(c=>c.status==='Active').length;
  const totalContractValue = DATA.contracts.filter(c=>c.status==='Active').reduce((a,c)=>a+c.contractValue,0);

  const byDept = {};
  reqs.forEach(r=>{
    if(!byDept[r.department]) byDept[r.department] = {count:0, requested:0, approved:0};
    byDept[r.department].count++;
    byDept[r.department].requested += r.requestedBudget;
    byDept[r.department].approved += r.approvedBudget||0;
  });

  const byType = {};
  PROJECT_TYPES.forEach(t=>byType[t]=0);
  reqs.forEach(r=>{ byType[r.projectType] = (byType[r.projectType]||0)+1; });

  const flagged = reqs.filter(r=>r.strategicFlag && !r.strategicFlag.resolved);
  const resolvedFlags = reqs.filter(r=>r.strategicFlag && r.strategicFlag.resolved);
  const canFlag = STATE.role === 'Strategy';

  return `
  ${pageHeader('Strategic Portfolio View','Cross-department view of vendor-management spend, pipeline health and budget utilization, with an advisory strategic-review flag — visibility only; it does not gate, pause or replace any step of the 14-step process.')}
  ${renderActionItems(STATE.role)}

  <div class="grid cols4">
    <div class="stat"><div class="num">${totalReq}</div><div class="lbl">Total Requests (all time)</div></div>
    <div class="stat"><div class="num">${fmt$(totalRequested)}</div><div class="lbl">Total Requested Budget</div></div>
    <div class="stat"><div class="num">${fmt$(totalApproved)}</div><div class="lbl">Total Approved Budget</div></div>
    <div class="stat"><div class="num">${activeContracts}</div><div class="lbl">Active Contracts (${fmt$(totalContractValue)})</div></div>
  </div>

  <div class="card">
    <h3>Spend &amp; Pipeline by Department</h3>
    <table><thead><tr><th>Department</th><th>Requests</th><th>Requested</th><th>Approved</th></tr></thead><tbody>
    ${Object.keys(byDept).map(d=>`<tr>
      <td>${d}</td><td>${byDept[d].count}</td><td>${fmt$(byDept[d].requested)}</td><td>${fmt$(byDept[d].approved)}</td>
    </tr>`).join('')}
    </tbody></table>
  </div>

  <div class="card">
    <h3>Pipeline by Project Type</h3>
    <div class="grid cols3" style="grid-template-columns:repeat(${PROJECT_TYPES.length},1fr)">
      ${PROJECT_TYPES.map(t=>`<div style="text-align:center"><div style="font-size:20px;font-weight:800;color:var(--navy)">${byType[t]||0}</div><div style="font-size:11px;color:var(--muted)">${t}</div></div>`).join('')}
    </div>
  </div>

  <h3 style="margin:18px 4px 10px">Budget Utilization Overview</h3>
  <div class="grid cols3">
  ${DATA.budgets.map(b=>{
    const pct = Math.min(100, Math.round((b.allocated/b.approved)*100));
    const over = pct>=85;
    return `<div class="card">
      <h3>${b.dept} <span class="note">(${b.category})</span></h3>
      <div class="bar ${over?'over':''}"><div style="width:${pct}%"></div></div>
      <div class="note">${pct}% utilized · ${fmt$(b.approved-b.allocated)} remaining</div>
    </div>`;
  }).join('')}
  </div>

  <div class="card">
    <div class="flex-between"><h3 style="margin:0">Strategic Review Flags</h3>
      ${canFlag? `<button class="btn small secondary" onclick="openFlagPicker()">+ Flag a Request</button>`:''}
    </div>
    <div class="note" style="margin-bottom:8px">Advisory only — flagging does not pause or block the request's progress through the 14-step process.</div>
    ${!flagged.length? '<div class="empty">No requests currently flagged for strategic review.</div>' : flagged.map(r=>`
      <div class="rowlink" style="padding:9px 4px;border-bottom:1px solid #eef1f4" onclick="go('requestDetail','${r.id}')">
        <b>${r.title}</b> <span class="pill amber">Flagged</span><br>
        <span class="note">${r.strategicFlag.note} — ${fmtDate(r.strategicFlag.date)}</span>
        ${canFlag? ` <button class="btn small secondary" onclick="event.stopPropagation();resolveStrategicFlag('${r.id}')">Mark Reviewed</button>`:''}
      </div>
    `).join('')}
    ${resolvedFlags.length? `<div class="note" style="margin-top:10px">${resolvedFlags.length} previously flagged item(s) marked reviewed.</div>`:''}
  </div>
  ${disclaimer()}`;
}
function openFlagPicker(){
  const reqs = DATA.requests.filter(r=>r.status!=='Completed' && !(r.strategicFlag && !r.strategicFlag.resolved));
  if(!reqs.length){ alert('No eligible requests to flag.'); return; }
  showModal(`
    <h3>Flag for Strategic Review <span class="close" onclick="closeModal()">✕</span></h3>
    <label class="f">Request</label><select class="fld" id="sfReq">${reqs.map(r=>`<option value="${r.id}">${r.title} (${r.id})</option>`)}</select>
    <label class="f">Note</label><textarea id="sfNote" placeholder="Why this needs strategic attention..."></textarea>
    <div style="margin-top:14px;text-align:right"><button class="btn secondary" onclick="closeModal()">Cancel</button> <button class="btn" onclick="flagForStrategy()">Flag</button></div>
  `);
}
function flagForStrategy(){
  const reqId = document.getElementById('sfReq').value;
  const note = document.getElementById('sfNote').value.trim() || 'Flagged for strategic portfolio review.';
  const r = DATA.requests.find(x=>x.id===reqId);
  r.strategicFlag = {note, date: isoDate(TODAY), resolved:false, by: STATE.role};
  addAudit(STATE.role, 'Flagged "'+r.title+'" for strategic review', r.id);
  notify('Strategy','Flag','"'+r.title+'" flagged for strategic review.');
  closeModal();
  renderAll();
}
function resolveStrategicFlag(reqId){
  const r = DATA.requests.find(x=>x.id===reqId);
  r.strategicFlag.resolved = true;
  addAudit(STATE.role, 'Marked strategic review flag as reviewed for "'+r.title+'"', r.id);
  renderAll();
}

/* ---- VENDOR EXTERNAL PORTAL VIEWS ---- */
function renderInvitations(){
  const invited = DATA.requests.filter(r=> (r.invitedVendors||[]).length && r.currentStep===5 && !(r.proposals&&r.proposals.length));
  return `
  ${pageHeader('My Invitations','Requests for quotation / proposal you have been invited to respond to.')}
  ${renderActionItems('Vendor (External)')}
  <div class="card">
  ${invited.length? invited.map(r=>`
    <div style="padding:10px 0;border-bottom:1px solid #eef1f4">
      <b>${r.title}</b> <span class="note">(${r.sourcingStrategy||'RFQ'})</span><br>
      <span class="note">Department: ${r.department} · Requested by MTN</span>
      ${r.proposals && r.proposals.length? `<div class="banner green" style="margin-top:6px">✓ Proposal submitted</div>` : `
      <div style="margin-top:8px"><label class="f">Proposal Amount (USD)</label><input type="number" id="prop_${r.id}" placeholder="e.g. 95000">
      <label class="f">Notes</label><textarea id="note_${r.id}" placeholder="Technical approach, delivery schedule..."></textarea>
      <button class="btn small" style="margin-top:8px" onclick="submitProposal('${r.id}')">Submit Proposal</button></div>`}
    </div>`).join('') : '<div class="empty">No open invitations right now.</div>'}
  </div>
  ${disclaimer()}`;
}
function submitProposal(reqId){
  const amt = Number(document.getElementById('prop_'+reqId).value||0);
  const note = document.getElementById('note_'+reqId).value;
  const r = DATA.requests.find(x=>x.id===reqId);
  r.proposals = r.proposals||[];
  r.proposals.push({vendor:'Vendor (External)', amount:amt, note, date:isoDate(TODAY)});
  doAdvance(reqId, 'Proposal received: '+fmt$(amt)+'. '+(note||''));
  notify('Technology Department','Proposal','A proposal was submitted for "'+r.title+'" — ready for technical evaluation.');
  go('invitations');
}
function renderMyProposals(){
  const mine = DATA.requests.filter(r=> (r.proposals||[]).length);
  return `${pageHeader('My Proposals','Proposals you have submitted and their evaluation status.')}
  <div class="card">${mine.length? mine.map(r=>`<div style="padding:10px 0;border-bottom:1px solid #eef1f4"><b>${r.title}</b><br><span class="note">Submitted ${fmt$(r.proposals[0].amount)} · Current stage: Step ${r.currentStep}/14 (${STEPS.find(s=>s.n===r.currentStep).name})</span></div>`).join('') : '<div class="empty">No proposals submitted yet.</div>'}</div>${disclaimer()}`;
}
function renderMyContracts(){
  const mine = DATA.contracts; // demo: vendor sees all contracts (single external vendor role in this prototype)
  return `${pageHeader('My Contracts','Contracts where you are the awarded vendor.')}
  <div class="card">${renderContracts_table(mine)}</div>${disclaimer()}`;
}
function renderContracts_table(list){
  if(!list.length) return '<div class="empty">No contracts yet.</div>';
  return `<table><thead><tr><th>Contract</th><th>Value</th><th>Duration</th><th>Status</th></tr></thead><tbody>
    ${list.map(c=>`<tr class="rowlink" onclick="go('contractDetail','${c.id}')"><td>${c.contractNumber}</td><td>${fmt$(c.contractValue)}</td><td>${durationText(c)}</td><td>${contractPill(c.status)}</td></tr>`).join('')}
  </tbody></table>`;
}
function renderMyPayments(){
  return `${pageHeader('My Payments','Payment status for your contracts with MTN.')}
  <div class="card"><table><thead><tr><th>Payment</th><th>Contract</th><th>Amount</th><th>Stage</th><th>Date</th></tr></thead><tbody>
  ${DATA.payments.map(p=>`<tr><td>${p.id}</td><td>${p.contractNumber}</td><td>${fmt$(p.amount)}</td><td><span class="pill ${p.stage==='Completed'?'green':(p.stage==='Processing'?'teal':'amber')}">${p.stage}</span></td><td>${fmtDate(p.date)}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">No payments yet.</td></tr>'}
  </tbody></table></div>${disclaimer()}`;
}

/* ---- AUDIT LOG ---- */
function renderAudit(){
  return `
  ${pageHeader('Audit Log','Complete, chronological record of every action across the vendor management process — for compliance and reporting purposes.')}
  <div class="card">
  <table><thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Entity</th></tr></thead><tbody>
  ${DATA.audit.filter(a=>!(PHASE1 && P1_HIDDEN_AUDIT.test(a.action))).map(a=>`<tr><td>${fmtDate(a.ts)}</td><td>${a.actor}</td><td>${a.action}</td><td>${a.entity}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">No activity yet.</td></tr>'}
  </tbody></table>
  </div>
  ${disclaimer()}`;
}

/* ---- MODAL ---- */
function showModal(html, wide){
  let bg = document.getElementById('modalBg');
  if(!bg){ bg = document.createElement('div'); bg.id='modalBg'; bg.className='modal-bg'; document.body.appendChild(bg); }
  bg.innerHTML = `<div class="modal${wide?' wide':''}">${html}</div>`;
  bg.style.display='flex';
  bg.onclick = (e)=>{ if(e.target===bg) closeModal(); };
}
function closeModal(){ const bg = document.getElementById('modalBg'); if(bg) bg.style.display='none'; }

function disclaimer(){ return ''; }

document.addEventListener('keydown', e=>{
  if(!e.altKey) return;
  if(e.key==='ArrowRight'){ e.preventDefault(); advanceDays(e.shiftKey?1:7); }
  else if(e.key==='0'){ e.preventDefault(); location.reload(); }
});

renderAll();
</script>
</body>
</html>
